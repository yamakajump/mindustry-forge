[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindustry-forge"
version = "0.1.0"
description = "Search for Mindustry schematics, scored by running the game"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Named rather than discovered. The repository root also holds bridge/ (Java), viewer/ and
# docs/ (a static site), and setuptools refuses to guess which of those is the package,
# so `pip install -e .` failed for everybody until this said so out loud.
[tool.setuptools]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
