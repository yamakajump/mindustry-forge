[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindustry-forge"
version = "0.1.0"
description = "The bench: run the real game and measure what a schematic produces"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

# Named rather than discovered. The repository root also holds bench/ (Java and Python) and
# site/ (Laravel), and setuptools refuses to guess which of those is the package.
[tool.setuptools]
packages = ["bench"]

[tool.setuptools.package-data]
bench = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
