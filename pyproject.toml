[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindustry-forge"
version = "0.1.0"
description = "The bench: run the real game and measure what a schematic produces"
requires-python = ">=3.11"

[project.optional-dependencies]
# `pyyaml` sert a `tests/test_workflows.py`, qui lit les fichiers de
# `.github/workflows/`. Lire du YAML a la regex marche jusqu au jour ou ca ne marche
# plus en silence : une cle `on:` nue se parse en booleen `True` en YAML 1.1, et un
# controle qui rate cette subtilite passe au vert sans rien avoir verifie.
dev = ["pytest>=8", "pyyaml>=6"]

# Named rather than discovered. The repository root also holds bench/ (Java and Python) and
# site/ (Laravel), and setuptools refuses to guess which of those is the package.
[tool.setuptools]
packages = ["bench"]

[tool.setuptools.package-data]
bench = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
