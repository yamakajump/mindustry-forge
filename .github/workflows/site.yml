# The site's CI: the JavaScript analyser and the Laravel application.
#
# tests.yml covers the file formats in tests/ and nothing under site/, so a
# green run there says nothing about the analyser or the application.
name: site

# Reads the code and writes nothing. Declared here rather than inherited: the
# repository's default token is write-scoped, and a job that only runs tests has
# no use for a token that can push.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyser:
    name: Analyser (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The analysis runs in the visitor's browser: these tests are the only
      # thing that guarantees a schematic read on their machine gives the
      # same result as here.
      - run: npm test

      # The check the README presents as the project's whole argument: the
      # numbers are proven against the game. It ran nowhere.
      #
      # The replay needs neither a server nor the game, only the
      # measurements already recorded under bench/data/oracle/, and it exits
      # in error past two per cent of gap. There was therefore no reason not
      # to have it here, and the README claimed it was.
      - name: The gap against the game
        run: npm run oracle

      # Informative: how far the steady-state solve is from the tick engine,
      # on the same scenarios. It is not a barrier, the two models are known
      # to diverge and the README says so; it is here so that the figure is
      # in the log of every run rather than in somebody's memory.
      - name: The gap between the two models
        run: node tools/gap.mjs | tail -6

  application:
    name: Application (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # sqlite: the tests run on an in-memory database, not on MySQL.
          extensions: mbstring, sqlite3, pdo_sqlite, zip, gd
          coverage: none

      # --no-check-lock was here, and it switched off the one check that catches the
      # lock drifting from composer.json. It had drifted: composer.json's content hash
      # no longer matched the one recorded in composer.lock, so `composer install`
      # warned and installed from the lock anyway, which is a warning nobody reads in
      # CI output. --no-check-publish stays, since this package is never published.
      - run: composer validate --no-check-publish

      - name: Cache the Composer dependencies
        uses: actions/cache@v6
        with:
          path: site/vendor
          key: composer-${{ hashFiles('site/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Prepare the test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: php artisan test

  # The tests run on in-memory SQLite, production runs on MySQL. So the
  # migrations were checked on no machine at all against the engine that will
  # really run them, while `deploy.sh` puts them into production on every
  # deployment. A migration that passes on SQLite and breaks on MySQL is the
  # site in maintenance for as long as it takes to work out why.
  migrations:
    name: Migrations (MySQL, as in production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mforge_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: mforge_ci
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none

      - name: Cache the Composer dependencies
        uses: actions/cache@v6
        with:
          path: site/vendor
          key: composer-${{ hashFiles('site/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Without this, an ignored variable would run the suite on SQLite and
      # the job would go green having checked nothing at all.
      - name: Check that this really talks to MySQL
        run: |
          php artisan tinker --execute='$d = DB::connection()->getDriverName(); if ($d !== "mysql") { fwrite(STDERR, "connection $d, not mysql"); exit(1); } echo "connected to ".DB::selectOne("select version() v")->v;'

      - name: Build the schema, tear it down, build it again
        run: |
          php artisan migrate --force
          php artisan migrate:reset --force
          php artisan migrate --force

      # The schema stands up; whether the catalogue's queries stand up too is
      # another question. They join and they group, and MySQL applies an
      # ONLY_FULL_GROUP_BY by default that SQLite ignores: a grouping accepted
      # here can be refused there.
      # The ranking is capped at 24, so it never returns more than that:
      # demanding exactly 24 amounts to demanding that the random seed produced
      # at least 24 graphite schematics out of 400, which is a draw. Measured on
      # the trunk: two failures in a row at 23 out of 400. What is worth
      # checking is that the query returns what it found, not that it got
      # lucky.
      - name: Run the catalogue's queries on MySQL
        env:
          CATALOGUE_SEED_COUNT: "400"
        run: |
          php artisan db:seed --class=CatalogueSeeder --force
          php artisan tinker --execute='$s = \App\Models\Schematic::class; $q = $s::listed()->join("schematic_items", "schematic_items.schematic_id", "=", "schematics.id")->where("schematic_items.item", "graphite")->select("schematics.*"); $n = (clone $q)->count(); $best = $q->orderByDesc("schematic_items.rate_per_block")->orderByDesc("schematics.id")->limit(24)->pluck("id"); $items = \App\Models\SchematicItem::count(); if ($n < 1 || $best->count() !== min(24, $n) || $items < 1) { fwrite(STDERR, "empty queries: filter $n, index $items"); exit(1); } echo "filter: $n, ranking: ".$best->count().", index rows: $items";'

      - name: The full suite, on MySQL
        run: php artisan test
