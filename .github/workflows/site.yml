# CI du site : l'analyseur JavaScript et l'application Laravel.
#
# Les deux autres workflows de ce depot (tests.yml, verify-catalogue.yml)
# datent de la structure d'avant le restart et ne couvrent pas site/.
# Celui-ci se declenche aussi sur la branche de travail, pas seulement
# sur main : c'est elle qui part en production.
name: site

on:
  push:
    branches: [main, "restart/**"]
  pull_request:

jobs:
  analyseur:
    name: Analyseur (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # L'analyse tourne dans le navigateur du visiteur : ces tests sont
      # la seule chose qui garantit qu'une schematique lue chez lui donne
      # le meme resultat qu'ici.
      - run: npm test

  application:
    name: Application (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # sqlite : les tests tournent sur une base en memoire, pas sur MySQL.
          extensions: mbstring, sqlite3, pdo_sqlite, zip, gd
          coverage: none

      - run: composer validate --no-check-publish --no-check-lock

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: site/vendor
          key: composer-${{ hashFiles('site/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Style du code
        run: vendor/bin/pint --test

      - name: Preparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: php artisan test

  # Les tests tournent sur SQLite en memoire, la production sur MySQL. Les
  # migrations n'etaient donc verifiees sur aucune machine contre le moteur
  # qui les jouera vraiment, alors que `deploy.sh` les passe en prod a chaque
  # deploiement. Une migration qui passe sur SQLite et casse sur MySQL, c'est
  # le site en maintenance le temps de comprendre.
  migrations:
    name: Migrations (MySQL, comme en production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mforge_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: mforge_ci
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: site/vendor
          key: composer-${{ hashFiles('site/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      # Sans ca, une variable ignoree ferait tourner la suite sur SQLite et le
      # job passerait au vert en n'ayant rien verifie du tout.
      - name: Verifier qu'on parle bien a MySQL
        run: |
          php artisan tinker --execute='$d = DB::connection()->getDriverName(); if ($d !== "mysql") { fwrite(STDERR, "connexion $d, pas mysql"); exit(1); } echo "connecte a ".DB::selectOne("select version() v")->v;'

      - name: Monter la base, la demonter, la remonter
        run: |
          php artisan migrate --force
          php artisan migrate:reset --force
          php artisan migrate --force

      # Le schema tient debout ; reste a savoir si les requetes de la vitrine
      # tiennent aussi. Le filtre par item passe par un chemin JSON, que MySQL
      # et SQLite n'ecrivent pas pareil.
      - name: Passer les requetes de la vitrine sur MySQL
        env:
          CATALOGUE_SEED_COUNT: "400"
        run: |
          php artisan db:seed --class=CatalogueSeeder --force
          php artisan tinker --execute='$s = \App\Models\Schematic::class; $n = $s::listed()->whereNotNull("produces->graphite")->count(); $best = $s::listed()->orderByDesc("power_per_block")->orderByDesc("power_made")->orderByDesc("id")->limit(24)->pluck("id"); if ($n < 1 || $best->count() !== 24) { fwrite(STDERR, "requetes vides: filtre $n"); exit(1); } echo "filtre: $n, classement: ".$best->count();'

      - name: La suite complete, sur MySQL
        run: php artisan test
