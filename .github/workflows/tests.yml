name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The suite skips its three engine-level checks without a JDK and a server jar, and
      # those are the only ones that prove the schematic format against the game rather
      # than against our own reader. Skipping them in CI would leave the format unguarded
      # exactly where it matters.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the pinned server
        uses: actions/cache@v4
        with:
          path: mindustry-forge
          key: mindustry-server-${{ hashFiles('bench/server_setup.py') }}

      - run: pip install -e ".[dev]"

      - name: Fetch the pinned server
        run: python -m bench.server_setup mindustry-forge

      - run: python -m pytest tests/ -q
