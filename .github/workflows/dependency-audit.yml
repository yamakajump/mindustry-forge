# Watches for known vulnerabilities in the dependencies.
#
# It also runs once a week, and not only on commits: a CVE is published when
# it is published, not when somebody touches the code. A quiet repository is
# exactly the one where a hole stays longest without being seen.
#
# Only Laravel is audited here, and that is deliberate: the analyser is
# hand-written JavaScript, `package.json` declares no dependency at all and
# exists only to carry the scripts. An npm job would have nothing to read.
name: dependency audit

# Reads the lock file and writes nothing. Declared here rather than inherited:
# the repository's default token is write-scoped, and a job that only asks
# packagist about advisories has no use for a token that can push.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  composer:
    name: Composer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      # --no-dev: a hole in Pint or Pest never runs in production. Reporting
      # them here would drown the ones that actually matter.
      #
      # Tried three times, because this job is a required check and the advisory
      # database is fetched over the network: a ten-second timeout at packagist
      # blocked a merge here on 28 August 2026, and the same run passed on a
      # retry a minute later. The retry answers a connection that did not open;
      # a real advisory fails all three attempts and still stops the merge.
      - name: Known vulnerabilities
        run: |
          for attempt in 1 2 3; do
            if composer audit --no-dev; then exit 0; fi
            code=$?
            if [ "$attempt" = 3 ]; then exit "$code"; fi
            echo "attempt $attempt failed with $code, retrying in 15 s" >&2
            sleep 15
          done
