name: verify catalogue

# Every submission is re-measured before it can join. Nobody has to take a contributor's
# word for a number, and nobody has to take the maintainer's word either: the bench is in
# this repository and this workflow is the whole of the review.
#
# It only ever runs the entries a branch actually added. Verifying one design costs one
# candidate, which is seconds; verifying the entire catalogue on every pull request would
# grow into minutes for no gain, since nothing else changed.

on:
  pull_request:
    paths:
      - "docs/catalogue.json"
      - "forge/**"
      - "bridge/**"

jobs:
  remeasure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # verify.py compares against the base branch to find what was added, so it needs
          # more than the single commit a default checkout fetches.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the pinned server
        uses: actions/cache@v4
        with:
          path: mindustry-forge
          key: mindustry-server-${{ hashFiles('forge/server_setup.py') }}

      - run: pip install -e ".[dev]"

      - name: Build the bridge
        run: ./gradlew jar --no-daemon
        working-directory: bridge

      - name: Fetch the pinned server
        run: python -m forge.server_setup mindustry-forge

      - name: Re-measure what this branch claims
        run: |
          python tools/verify.py \
            --changed-against "origin/${{ github.base_ref }}" \
            --bridge-port 7970 --game-port 6570
