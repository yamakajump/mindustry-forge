name: release-please

# WHAT THIS FILE IS FOR, and how it came to do nothing.
#
# It only ever ran on `restart/place-de-marche`, the branch the work lived on before the
# restart was merged back. That branch was deleted on 27/08/2026, and `git ls-remote --heads
# origin restart/place-de-marche` returns nothing: since the merge, no push has matched this
# trigger, so release-please has not run once. There is no tag and no release in the
# repository, and 242 commits have landed on `main` behind that silence.
#
# Nothing failed. A workflow that never triggers is green by never being red, which is why
# this went unnoticed: the version automation was not broken, it was absent, and absence has
# no red cross next to it.
#
# `main` is the only branch now, and it is hardcoded in both places below. `on.push.branches`
# does not accept expressions, so `github.event.repository.default_branch` cannot be used
# here; if the default branch is ever renamed, both lines have to move together.
on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
