<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge - planificateur d'usine Mindustry</title>
<meta name="description" content="Dis combien tu veux produire par minute, et repars avec la liste des blocs, le cout de construction, l'energie a fournir et les foreuses a poser.">
<!-- Three icon formats, because three families of client ask for one differently: the
     .ico for whatever hits /favicon.ico without reading the head, the SVG for any current
     browser, the square PNG for the iOS home screen. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b2027">
<link rel="stylesheet" href="../forge/forge.css">
<script src="../forge/nav.js" type="module" defer></script>
<link rel="stylesheet" href="../forge/plan.css">
</head>
<body>
<header>
  <a class="brand" href="/">
    <svg class="signe" viewBox="0 0 32 32" aria-hidden="true" fill="currentColor"><path d="M6 6h4v20H6z"/><path d="M10 6h12v4H10z"/><path d="M22 4l5 4-5 4z"/><path d="M10 14h10v4H10z"/></svg>
    Mindustry <span>Forge</span>
  </a>
  <!-- The same header as `resources/views/partials/nav.blade.php`, written by hand because
       this page is served as it lies and never meets PHP. A test compares it against
       `config/nav.php`: an entry that lands there and not here cannot be merged.

       The French is written out in clear and `data-i18n` carries only the key. Nothing to
       substitute while the site speaks the language it is written in, so no flicker, and a
       reader without JavaScript reads words rather than keys. -->
  <button class="deplier" type="button" aria-expanded="false" aria-controls="nav"
          data-i18n-aria-label="nav.barre.deplier" aria-label="Ouvrir le menu" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <nav id="nav">
    <a href="/" data-i18n="nav.barre.analyser">Analyser</a>
    <a href="/editer" data-i18n="nav.barre.editer">Editer</a>
    <details class="menu">
      <summary data-i18n="nav.barre.schematiques">Schémas</summary>
      <div class="menu-list">
        <a href="/schemas" data-i18n="nav.menu.parcourir">Parcourir</a>
        <a href="/comparer" data-i18n="nav.menu.comparer">Comparer</a>
      </div>
    </details>
    <details class="menu">
      <summary data-i18n="nav.barre.outils">Outils</summary>
      <div class="menu-list">
        <a href="/outils/logique" data-i18n="nav.menu.logique">Logique</a>
        <a href="/outils/planificateur" data-i18n="nav.menu.planificateur">Planificateur</a>
      </div>
    </details>
    <a href="/blocs" data-i18n="nav.barre.blocs">Blocs</a>
  </nav>
</header>

<div class="outil">
  <header class="titre">
    <h1 data-i18n="outils.planificateur.titre">Planificateur d'usine</h1>
    <p class="lede" data-i18n="outils.planificateur.sous-titre">
      Dis ce que tu veux produire et a quel rythme. La chaine est remontee jusqu'au sol,
      avec les chiffres du jeu.
    </p>
  </header>

  <form class="card demande" id="demande">
    <div class="row" style="margin:0">
      <label class="lead" for="quantite" data-i18n="outils.planificateur.je-veux">Je veux</label>
      <input id="quantite" type="number" min="1" max="100000" step="1" value="100"
             inputmode="numeric">
      <select id="objet"></select>
      <!-- A rate that is chosen rather than imposed. A late-game chain is thought about by
           the second, an early-game one by the minute, and converting in your head while
           sizing a factory is exactly the arithmetic this page exists to spare you. -->
      <select id="cadence" aria-label="Cadence">
        <option value="minute" data-i18n="outils.planificateur.par-minute">par minute</option>
        <option value="seconde" data-i18n="outils.planificateur.par-seconde">par seconde</option>
      </select>
      <select id="planete">
        <option value="serpulo">Serpulo</option>
        <option value="erekir">Erekir</option>
      </select>
      <button class="primary" type="submit" data-i18n="outils.planificateur.calculer">Calculer</button>
    </div>
  </form>

  <div id="sortie"></div>
</div>

<script type="module">
/*
 * The planner's page.
 *
 * It computes nothing: everything comes from `plan.js`, which walks the chain back up from
 * the catalogue, and from `needs.js`, which turns a raw rate into drills. A page computing
 * on its own side would be a second answer to the same question.
 */
import { loadCatalogue } from "../forge/analyse.js";
import { plan } from "../forge/plan.js";
import { t, translate, ready } from "../forge/i18n.js";
import { loadNames, nameOf } from "../forge/noms.js";

/* Every assumption named in full, never a prefix followed by a variable. A key glued
   together at render time is a key no check sees, so the day `plan.js` adds one, the page
   prints the raw key to a reader and nothing reports it.

   Written without an example, deliberately: the key check reads comments too, so a fragment
   of a key in this sentence would be reported as a key with no translation. Seen right
   here, after warning two other lanes about it. */
const HYPOTHESES = {
  fed: "outils.planificateur.suppose-alimente",
  partial: "outils.planificateur.suppose-partiel",
  power: "outils.planificateur.suppose-courant",
  patch: "outils.planificateur.suppose-tache",
};

const $ = (id) => document.getElementById(id);
const sortie = $("sortie");

const catalogue = await loadCatalogue("../forge/blocks.json");
/* The game's names, loaded with the rest. Eighteen kilobytes, and without them the page
   shows tidied-up identifiers: `Blast drill` instead of `Foreuse a explosion`. */
await Promise.all([loadNames(), ready]);

/* The items that can be asked for: what the game knows how to make, plus what it knows how
   to extract. Offered rather than typed, so that a player picks from what exists instead of
   guessing at a spelling. */
/** Which unit the player chose. Read from the same place by the computation and the display. */
function parSeconde() {
  return $("cadence").value === "seconde";
}

function objetsProposes(planete) {
  const noms = new Set();
  for (const [nom, bloc] of Object.entries(catalogue.blocks)) {
    if (bloc.build_visibility === "hidden") continue;
    if (bloc.planet && bloc.planet !== planete) continue;
    for (const objet of Object.keys(bloc.output || {})) noms.add(objet);
  }
  return [...noms].sort((a, b) =>
    (catalogue.items[a]?.id ?? 0) - (catalogue.items[b]?.id ?? 0));
}

function remplirObjets() {
  const planete = $("planete").value;
  const garde = $("objet").value;
  $("objet").innerHTML = "";
  /* Triees sur le nom affiche et pas sur l'identifiant : une liste francaise rangee dans
     l'ordre alphabetique anglais met « Charbon » avant « Cuivre » et « Sable » apres
     « Silicium », ce qui se lit comme un desordre. */
  const objets = objetsProposes(planete)
    .map((nom) => ({ nom, affiche: lisible(nom) }))
    .sort((a, b) => a.affiche.localeCompare(b.affiche, "fr"));

  for (const { nom, affiche } of objets) {
    const option = document.createElement("option");
    option.value = nom;
    option.textContent = affiche;
    $("objet").append(option);
  }
  if ([...$("objet").options].some((o) => o.value === garde)) $("objet").value = garde;
}

const nombre = (valeur, decimales = 2) =>
  Number(valeur).toLocaleString("fr-FR", { maximumFractionDigits: decimales });

/*
 * Le nom d'un bloc ou d'un objet, tel qu'on peut le montrer aujourd'hui.
 *
 * Le catalogue ne porte aucun nom lisible : `items.copper.name` vaut « copper », et un bloc
 * n'a que son identifiant. Un joueur francophone lisait donc « silicon-smelter » et
 * « blast-drill » en toutes lettres.
 *
 * Le vrai correctif n'est pas ici : le jeu embarque ses propres traductions, et
 * `DumpBlocks.java` peut lire `Core.bundle` pour sortir un nom francais par bloc, ce qui
 * vaut infiniment mieux qu'une table de 254 entrees ecrite a la main et vieillie a chaque
 * version. En attendant, l'identifiant redresse se lit deja beaucoup mieux que l'identifiant
 * brut. Meme regle que `Block::title()` cote PHP, et les deux bougeront ensemble le jour ou
 * le catalogue portera de vrais noms.
 */
/* The name the game gives it, in the reader's language, and the tidied-up identifier when
   it gives none. The fallback serves seventeen blocks the game names in none of its
   thirty-seven languages, and the first render if the names are not loaded yet. */
const lisible = (id, famille = null) => nameOf(famille || familleDe(id), id);

/*
 * Which family a thing belongs to, asked of the catalogue rather than written out as a list.
 *
 * The icon address serves three families, and the catalogue already knows which one to file
 * a name under: what is in `items` is an item, what is in `liquids` is a liquid, the rest is
 * a block. A hand-kept list would start lying the moment the game adds one.
 */
const familleDe = (nom) =>
  (catalogue.items?.[nom] && "objet")
  || (catalogue.liquids?.[nom] && "liquide")
  || "bloc";

/** A thing from the game: its icon, and its name. */
function chose(nom, famille = null, taille = 20) {
  const span = document.createElement("span");
  span.className = "plan-chose";
  const img = document.createElement("img");
  img.className = "icone";
  img.src = `/icone/${famille || familleDe(nom)}/${encodeURIComponent(nom)}.png?t=32`;
  img.width = taille;
  img.height = taille;
  img.loading = "lazy";
  /* Empty, because the name is written right next to it: a screen reader announcing
     "sand sand" is worse than one that says nothing. */
  img.alt = "";
  /* Four blocks out of 395 have no image, `air` and three obsolete unit factories, which
     nobody shows here. If one came through anyway, the broken image removes itself and the
     name stays: a missing icon must not be seen. */
  img.addEventListener("error", () => img.remove());
  span.append(img, document.createTextNode(lisible(nom, famille || familleDe(nom))));
  return span;
}

/* Accepts either text or a node on both sides. A second function for the "with icon" case
   would have doubled the layout for a difference that fits inside one `append`. */
function ligne(gauche, droite, classe = "") {
  const div = document.createElement("div");
  div.className = "line";
  const a = document.createElement("span");
  a.append(gauche);
  const b = document.createElement("span");
  b.className = classe;
  b.append(droite);
  div.append(a, b);
  return div;
}

/** The arrow between what you place and what it puts out. */
function fleche() {
  const span = document.createElement("span");
  span.className = "plan-fleche";
  span.textContent = "→";
  return span;
}

/** Several things in a row, separated by a slash: the drills to choose from. */
function choix(noms, famille) {
  const span = document.createElement("span");
  span.className = "plan-choix";
  noms.forEach((entree, i) => {
    if (i) {
      const sep = document.createElement("span");
      sep.className = "plan-fleche";
      sep.textContent = "/";
      span.append(sep);
    }
    const groupe = document.createElement("span");
    groupe.className = "plan-chose";
    groupe.append(document.createTextNode(`${entree.count} `), chose(entree.block, famille, 18));
    span.append(groupe);
  });
  return span;
}

function carte(titreCle) {
  const div = document.createElement("div");
  div.className = "card";
  const h2 = document.createElement("h2");
  h2.textContent = t(titreCle);
  div.append(h2);
  return div;
}

function dessiner(resultat) {
  sortie.replaceChildren();

  if (resultat.cycles.length) {
    const alerte = carte("outils.planificateur.boucle");
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = resultat.cycles[0].join(" -> ");
    alerte.append(p);
    sortie.append(alerte);
    return;
  }

  if (!resultat.steps.length && !resultat.raw.length) {
    const rien = carte("outils.planificateur.plan");
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = t("outils.planificateur.rien");
    rien.append(p);
    sortie.append(rien);
    return;
  }

  /* The assumptions first, never as a footnote. A player building against an optimistic
     figure builds a factory that under-runs with no way of seeing why, and that is the
     fault this repository paid for three times in one day. */
  if (resultat.assumptions.length) {
    const dit = carte("outils.planificateur.hypotheses");
    const liste = document.createElement("ul");
    liste.className = "notes";
    for (const cle of resultat.assumptions) {
      if (!HYPOTHESES[cle]) continue;
      const li = document.createElement("li");
      li.textContent = t(HYPOTHESES[cle]);
      liste.append(li);
    }
    dit.append(liste);
    sortie.append(dit);
  }

  const usines = carte("outils.planificateur.a-construire");
  for (const etape of resultat.steps) {
    /* The whole number and the fraction, always both: 3.2 smelters means 4 smelters at
       80 %, and those are two different factories. The number is assembled here and never
       slipped into a translated string: when a key is missing, `t` renders the key without
       substituting, and the figure would disappear. A lost figure is worse than an
       unreadable word on a site that sells nothing but numbers. */
    const droite = `${etape.whole} ${t("outils.planificateur.blocs")}`
      + ` - ${nombre(etape.load * 100, 0)} ${t("outils.planificateur.de-charge")}`;
    const gauche = document.createElement("span");
    gauche.className = "plan-paire";
    gauche.append(chose(etape.block, "bloc"), fleche(), chose(etape.item));
    usines.append(ligne(gauche, droite, etape.load < 0.999 ? "warn" : "good"));
  }
  sortie.append(usines);

  if (resultat.raw.length) {
    const sol = carte("outils.planificateur.a-fournir");
    for (const brut of resultat.raw) {
      /* The number stays outside the translation. A missing key renders the key without
         substituting, so `t("...", { n })` would make the figure disappear in silence, and
         on a site that sells nothing but numbers it is the information that goes. */
      const droite = document.createElement("span");
      droite.className = "plan-paire";
      droite.append(document.createTextNode(parSeconde()
        ? `${nombre(brut.perMinute / 60, 2)}${t("outils.planificateur.par-sec")}`
        : `${nombre(brut.perMinute, 1)}${t("outils.planificateur.par-min")}`));

      /* Several drills offered, not only the best one. `needs.js` sorts them by increasing
         count, so the first is always the biggest in the game: answering "a blast drill" to
         "I need sand" is exact and unusable, because nobody unlocks the end-game drill for
         sand. The planner shows the choice instead of making it for the player.

         Four, and not three. The list being sorted by increasing count, cutting at three
         always dropped the last one, which is the cheapest to unlock: the mechanical drill
         on Serpulo, the plasma bore on Erekir. So the cut systematically removed the only
         option somebody starting out owns, that is, the reader who needs this screen most.
         Four is a world's real pool, measured in the catalogue, and the planet is always
         chosen here. */
      const options = brut.options.slice(0, 4);
      if (options.length) {
        droite.append(fleche(), choix(options, "bloc"));
      } else {
        const rien = document.createElement("span");
        rien.className = "plan-fleche";
        rien.textContent = t("outils.planificateur.sans-source");
        droite.append(rien);
      }

      sol.append(ligne(chose(brut.resource), droite));
    }
    sortie.append(sol);
  }

  const bilan = carte("outils.planificateur.bilan");
  if (resultat.power > 0) {
    bilan.append(ligne(t("outils.planificateur.energie"),
      `${nombre(resultat.power, 0)} ${t("outils.planificateur.energie-seconde")}`, "warn"));
  }
  for (const [objet, quantite] of Object.entries(resultat.cost)) {
    bilan.append(ligne(chose(objet), nombre(quantite, 0)));
  }
  sortie.append(bilan);
}

function calculer(evenement) {
  evenement?.preventDefault();
  dessiner(plan(catalogue, {
    item: $("objet").value,
    /* Converted here and nowhere else: the engine reasons in rate per minute, and letting
       two units circulate through the computation is how a factor of sixty ends up missing
       in exactly one place.

       The option's value is the unit's name and not its factor. With the factor written
       into the HTML, the first version carried 60 on "par minute" and 1 on "par seconde",
       that is, the wrong way round, and nothing said so: the page answered, with figures
       sixty times too large. A name can be read back, a multiplier cannot. */
    perMinute: Number($("quantite").value) * (parSeconde() ? 60 : 1),
    planet: $("planete").value,
  }));
}

$("planete").addEventListener("change", () => { remplirObjets(); calculer(); });
$("cadence").addEventListener("change", () => calculer());
$("demande").addEventListener("submit", calculer);

remplirObjets();
if ([...$("objet").options].some((o) => o.value === "silicon")) $("objet").value = "silicon";
translate(document);
calculer();
</script>
</body>
</html>
