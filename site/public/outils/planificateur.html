<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge - planificateur d'usine Mindustry</title>
<meta name="description" content="Dis combien tu veux produire par minute, et repars avec la liste des blocs, le cout de construction, l'energie a fournir et les foreuses a poser.">
<!-- Three icon formats, because three families of client ask for one differently: the
     .ico for whatever hits /favicon.ico without reading the head, the SVG for any current
     browser, the square PNG for the iOS home screen. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b2027">
<link rel="stylesheet" href="../forge/forge.css">
<script src="../forge/nav.js" type="module" defer></script>
<link rel="stylesheet" href="../forge/plan.css">
</head>
<body>
<header>
  <a class="brand" href="/">
    <svg class="signe" viewBox="0 0 32 32" aria-hidden="true" fill="currentColor"><path d="M6 6h4v20H6z"/><path d="M10 6h12v4H10z"/><path d="M22 4l5 4-5 4z"/><path d="M10 14h10v4H10z"/></svg>
    Mindustry <span>Forge</span>
  </a>
  <!-- Le meme entete que `resources/views/partials/nav.blade.php`, ecrit a la main parce
       que cette page est servie telle quelle et ne rencontre jamais PHP. Un test la compare
       a `config/nav.php` : une entree qui atterrit la-bas et pas ici ne peut pas etre
       fusionnee.

       Le francais est ecrit en clair et `data-i18n` ne porte que la cle. Rien a remplacer
       tant que le site parle la langue dans laquelle il est ecrit, donc pas de scintillement,
       et un lecteur sans JavaScript lit des mots plutot que des cles. -->
  <button class="deplier" type="button" aria-expanded="false" aria-controls="nav"
          data-i18n-aria-label="nav.barre.deplier" aria-label="Ouvrir le menu" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <nav id="nav">
    <a href="/" data-i18n="nav.barre.analyser">Analyser</a>
    <a href="/editer" data-i18n="nav.barre.editer">Editer</a>
    <details class="menu">
      <summary data-i18n="nav.barre.schematiques">Schematiques</summary>
      <div class="menu-list">
        <a href="/schematiques" data-i18n="nav.menu.parcourir">Parcourir</a>
        <a href="/comparer" data-i18n="nav.menu.comparer">Comparer</a>
      </div>
    </details>
    <details class="menu">
      <summary data-i18n="nav.barre.outils">Outils</summary>
      <div class="menu-list">
        <a href="/outils/logique" data-i18n="nav.menu.logique">Logique</a>
        <a href="/outils/planificateur" data-i18n="nav.menu.planificateur">Planificateur</a>
      </div>
    </details>
    <a href="/blocs" data-i18n="nav.barre.blocs">Blocs</a>
  </nav>
</header>

<div class="outil">
  <header class="titre">
    <h1 data-i18n="outils.planificateur.titre">Planificateur d'usine</h1>
    <p class="lede" data-i18n="outils.planificateur.sous-titre">
      Dis ce que tu veux produire et a quel rythme. La chaine est remontee jusqu'au sol,
      avec les chiffres du jeu.
    </p>
  </header>

  <form class="card demande" id="demande">
    <div class="row" style="margin:0">
      <label class="lead" for="quantite" data-i18n="outils.planificateur.je-veux">Je veux</label>
      <input id="quantite" type="number" min="1" max="100000" step="1" value="100"
             inputmode="numeric">
      <select id="objet"></select>
      <label class="lead" for="objet" data-i18n="outils.planificateur.par-minute">par minute</label>
      <select id="planete">
        <option value="serpulo">Serpulo</option>
        <option value="erekir">Erekir</option>
      </select>
      <button class="primary" type="submit" data-i18n="outils.planificateur.calculer">Calculer</button>
    </div>
  </form>

  <div id="sortie"></div>
</div>

<script type="module">
/*
 * La page du planificateur.
 *
 * Elle ne calcule rien : tout vient de `plan.js`, qui remonte la chaine depuis le
 * catalogue, et de `needs.js`, qui traduit un debit brut en foreuses. Une page qui
 * calculerait de son cote serait une deuxieme reponse a la meme question.
 */
import { loadCatalogue } from "../forge/analyse.js";
import { plan } from "../forge/plan.js";
import { t, translate, ready } from "../forge/i18n.js";

/* Chaque hypothese nommee en toutes lettres, jamais un prefixe suivi d'une variable. Une
   cle collee au rendu est une cle qu'aucun controle ne voit, donc le jour ou `plan.js` en
   ajoute une, la page imprime la cle brute a un lecteur et rien ne le signale.

   Ecrit sans exemple, volontairement : le controle des cles lit aussi les commentaires,
   donc un fragment de cle dans cette phrase serait rapporte comme une cle sans traduction.
   Constate ici meme, apres l'avoir signale a deux autres voies. */
const HYPOTHESES = {
  fed: "outils.planificateur.suppose-alimente",
  partial: "outils.planificateur.suppose-partiel",
  power: "outils.planificateur.suppose-courant",
  patch: "outils.planificateur.suppose-tache",
};

const $ = (id) => document.getElementById(id);
const sortie = $("sortie");

const catalogue = await loadCatalogue("../forge/blocks.json");
await ready;

/* Les objets qu'on peut demander : ce que le jeu sait fabriquer, plus ce qu'il sait
   extraire. Proposes plutot que tapes, pour qu'un joueur choisisse dans ce qui existe au
   lieu de deviner une orthographe. */
function objetsProposes(planete) {
  const noms = new Set();
  for (const [nom, bloc] of Object.entries(catalogue.blocks)) {
    if (bloc.build_visibility === "hidden") continue;
    if (bloc.planet && bloc.planet !== planete) continue;
    for (const objet of Object.keys(bloc.output || {})) noms.add(objet);
  }
  return [...noms].sort((a, b) =>
    (catalogue.items[a]?.id ?? 0) - (catalogue.items[b]?.id ?? 0));
}

function remplirObjets() {
  const planete = $("planete").value;
  const garde = $("objet").value;
  $("objet").innerHTML = "";
  for (const nom of objetsProposes(planete)) {
    const option = document.createElement("option");
    option.value = nom;
    option.textContent = nom;
    $("objet").append(option);
  }
  if ([...$("objet").options].some((o) => o.value === garde)) $("objet").value = garde;
}

const nombre = (valeur, decimales = 2) =>
  Number(valeur).toLocaleString("fr-FR", { maximumFractionDigits: decimales });

/*
 * Le nom d'un bloc ou d'un objet, tel qu'on peut le montrer aujourd'hui.
 *
 * Le catalogue ne porte aucun nom lisible : `items.copper.name` vaut « copper », et un bloc
 * n'a que son identifiant. Un joueur francophone lisait donc « silicon-smelter » et
 * « blast-drill » en toutes lettres.
 *
 * Le vrai correctif n'est pas ici : le jeu embarque ses propres traductions, et
 * `DumpBlocks.java` peut lire `Core.bundle` pour sortir un nom francais par bloc, ce qui
 * vaut infiniment mieux qu'une table de 254 entrees ecrite a la main et vieillie a chaque
 * version. En attendant, l'identifiant redresse se lit deja beaucoup mieux que l'identifiant
 * brut. Meme regle que `Block::title()` cote PHP, et les deux bougeront ensemble le jour ou
 * le catalogue portera de vrais noms.
 */
const lisible = (id) => String(id).replace(/-/g, " ").replace(/^./, (c) => c.toUpperCase());

/*
 * De quelle famille une chose releve, demande au catalogue plutot qu'ecrit en liste.
 *
 * L'adresse des icones sert trois familles, et le catalogue sait deja dans laquelle ranger
 * un nom : ce qui est dans `items` est un objet, ce qui est dans `liquids` un liquide, le
 * reste un bloc. Une liste tenue a la main se mettrait a mentir des que le jeu en ajoute un.
 */
const familleDe = (nom) =>
  (catalogue.items?.[nom] && "objet")
  || (catalogue.liquids?.[nom] && "liquide")
  || "bloc";

/** Une chose du jeu : son icone, et son nom. */
function chose(nom, famille = null, taille = 20) {
  const span = document.createElement("span");
  span.className = "plan-chose";
  const img = document.createElement("img");
  img.className = "icone";
  img.src = `/icone/${famille || familleDe(nom)}/${encodeURIComponent(nom)}.png?t=32`;
  img.width = taille;
  img.height = taille;
  img.loading = "lazy";
  /* Vide, parce que le nom est ecrit juste a cote : un lecteur d'ecran qui annonce
     « sable sable » est pire qu'un qui ne dit rien. */
  img.alt = "";
  /* Quatre blocs sur 395 n'ont pas d'image, `air` et trois usines d'unites hors d'age, que
     personne n'affiche ici. Si l'un passait quand meme, l'image cassee se retire elle-meme
     et le nom reste : une icone manquante ne doit pas se voir. */
  img.addEventListener("error", () => img.remove());
  span.append(img, document.createTextNode(lisible(nom)));
  return span;
}

/* Accepte un texte ou un noeud des deux cotes. Une deuxieme fonction pour le cas « avec
   icone » aurait double la mise en page pour une difference qui tient dans un `append`. */
function ligne(gauche, droite, classe = "") {
  const div = document.createElement("div");
  div.className = "line";
  const a = document.createElement("span");
  a.append(gauche);
  const b = document.createElement("span");
  b.className = classe;
  b.append(droite);
  div.append(a, b);
  return div;
}

/** La fleche entre ce qu'on pose et ce que ca sort. */
function fleche() {
  const span = document.createElement("span");
  span.className = "plan-fleche";
  span.textContent = "→";
  return span;
}

/** Plusieurs choses a la suite, separees par une barre : les foreuses au choix. */
function choix(noms, famille) {
  const span = document.createElement("span");
  span.className = "plan-choix";
  noms.forEach((entree, i) => {
    if (i) {
      const sep = document.createElement("span");
      sep.className = "plan-fleche";
      sep.textContent = "/";
      span.append(sep);
    }
    const groupe = document.createElement("span");
    groupe.className = "plan-chose";
    groupe.append(document.createTextNode(`${entree.count} `), chose(entree.block, famille, 18));
    span.append(groupe);
  });
  return span;
}

function carte(titreCle) {
  const div = document.createElement("div");
  div.className = "card";
  const h2 = document.createElement("h2");
  h2.textContent = t(titreCle);
  div.append(h2);
  return div;
}

function dessiner(resultat) {
  sortie.replaceChildren();

  if (resultat.cycles.length) {
    const alerte = carte("outils.planificateur.boucle");
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = resultat.cycles[0].join(" -> ");
    alerte.append(p);
    sortie.append(alerte);
    return;
  }

  if (!resultat.steps.length && !resultat.raw.length) {
    const rien = carte("outils.planificateur.plan");
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = t("outils.planificateur.rien");
    rien.append(p);
    sortie.append(rien);
    return;
  }

  /* Les hypotheses en premier, jamais en note de bas de page. Un joueur qui construit
     contre un chiffre optimiste construit une usine qui sous-tourne sans qu'il puisse
     voir pourquoi, et c'est la faute que ce depot a payee trois fois dans la journee. */
  if (resultat.assumptions.length) {
    const dit = carte("outils.planificateur.hypotheses");
    const liste = document.createElement("ul");
    liste.className = "notes";
    for (const cle of resultat.assumptions) {
      if (!HYPOTHESES[cle]) continue;
      const li = document.createElement("li");
      li.textContent = t(HYPOTHESES[cle]);
      liste.append(li);
    }
    dit.append(liste);
    sortie.append(dit);
  }

  const usines = carte("outils.planificateur.a-construire");
  for (const etape of resultat.steps) {
    /* Le nombre entier et la fraction, toujours les deux : 3,2 fours, c'est 4 fours a
       80 %, et ce sont deux usines differentes. Le nombre est assemble ici et jamais glisse dans une chaine traduite : quand une
       cle manque, `t` rend la cle sans substituer, et le chiffre disparaitrait. Un chiffre
       perdu est pire qu'un mot illisible sur un site qui ne vend que des chiffres. */
    const droite = `${etape.whole} ${t("outils.planificateur.blocs")}`
      + ` - ${nombre(etape.load * 100, 0)} ${t("outils.planificateur.de-charge")}`;
    const gauche = document.createElement("span");
    gauche.className = "plan-paire";
    gauche.append(chose(etape.block, "bloc"), fleche(), chose(etape.item));
    usines.append(ligne(gauche, droite, etape.load < 0.999 ? "warn" : "good"));
  }
  sortie.append(usines);

  if (resultat.raw.length) {
    const sol = carte("outils.planificateur.a-fournir");
    for (const brut of resultat.raw) {
      const droite = document.createElement("span");
      droite.className = "plan-paire";
      droite.append(document.createTextNode(
        `${nombre(brut.perMinute, 1)}${t("outils.planificateur.par-min")}`));

      /* Plusieurs foreuses proposees, pas seulement la meilleure. `needs.js` les classe par
         nombre croissant, donc la premiere est toujours la plus grosse du jeu : repondre
         « une foreuse a explosifs » a « il me faut du sable » est exact et inutilisable,
         parce que personne ne debloque la foreuse de fin de partie pour du sable. Le
         planificateur montre le choix au lieu de le faire a la place du joueur. */
      const options = brut.options.slice(0, 3);
      if (options.length) {
        droite.append(fleche(), choix(options, "bloc"));
      } else {
        const rien = document.createElement("span");
        rien.className = "plan-fleche";
        rien.textContent = t("outils.planificateur.sans-source");
        droite.append(rien);
      }

      sol.append(ligne(chose(brut.resource), droite));
    }
    sortie.append(sol);
  }

  const bilan = carte("outils.planificateur.bilan");
  if (resultat.power > 0) {
    bilan.append(ligne(t("outils.planificateur.energie"),
      `${nombre(resultat.power, 0)} ${t("outils.planificateur.energie-seconde")}`, "warn"));
  }
  for (const [objet, quantite] of Object.entries(resultat.cost)) {
    bilan.append(ligne(chose(objet), nombre(quantite, 0)));
  }
  sortie.append(bilan);
}

function calculer(evenement) {
  evenement?.preventDefault();
  dessiner(plan(catalogue, {
    item: $("objet").value,
    perMinute: Number($("quantite").value),
    planet: $("planete").value,
  }));
}

$("planete").addEventListener("change", () => { remplirObjets(); calculer(); });
$("demande").addEventListener("submit", calculer);

remplirObjets();
if ([...$("objet").options].some((o) => o.value === "silicon")) $("objet").value = "silicon";
translate(document);
calculer();
</script>
</body>
</html>
