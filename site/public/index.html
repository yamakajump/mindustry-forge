<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge - analyser une schematique Mindustry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314161c'/%3E%3Cpath d='M8 22V10h10M8 16h8' stroke='%23ffd37f' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./forge/forge.css">
</head>
<body>
<header>
  <a class="brand" href="/">Mindustry <span>Forge</span></a>
  <nav id="nav">
    <a href="/">Analyser</a>
    <a href="/schematiques">Parcourir</a>
  </nav>
</header>

<main>
  <div class="drop" id="drop">
    <label class="lead" for="text">
      Colle la schematique copiee dans le jeu (ctrl+c sur une selection), ou depose un
      fichier <code>.msch</code>.
    </label>
    <textarea id="text" spellcheck="false" autocomplete="off"
              placeholder="bXNjaAF4nD..."></textarea>

    <div class="row">
      <button class="primary" id="go" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Analyser
      </button>
      <label class="file">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>
        Choisir un fichier
        <input type="file" id="file" accept=".msch" aria-label="Choisir un fichier .msch">
      </label>
      <button id="build" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M17.5 14v7M14 17.5h7"/></svg>
        Construire depuis zero
      </button>
      <button id="paste" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2"/></svg>
        Coller le presse-papiers
      </button>
    </div>

    <details class="supply">
      <summary>Simuler un apport reel plutot que le plein regime</summary>
      <p class="hint-line">
Forge calcule deja ce qu'il faut pour tourner a fond. Si tu veux savoir ce que ca
        donne avec moins que ca, indique ici ce qui arrive vraiment, par seconde. Le total
        est reparti sur les entrees du reseau concerne.
      </p>
      <div class="row">
        <input type="text" id="supply" placeholder="water=120, coal=4" autocomplete="off"
               aria-label="Ce qui arrive de l'exterieur, par seconde">
      </div>
    </details>
  </div>

  <div id="out" aria-live="polite"></div>
</main>

<!-- L'editeur vit hors de <main>, qui est borne a 1120 pixels de large : le plateau prend
     tout l'ecran, et une largeur maximale pensee pour un article de texte n'a rien a lui
     dire. -->
<div id="editor"></div>

<script type="module">
import { analyse, catalogueOf, loadCatalogue } from "./forge/analyse.js";
import { fromBase64, toBase64 } from "./forge/schematic.js";
import { loadSprites, draw, itemIcon, bounds } from "./forge/render.js";
import { mountEditor } from "./forge/editor/mount.js";

const $ = (id) => document.getElementById(id);
const text = $("text"), out = $("out"), drop = $("drop");

/* A file dropped and a string pasted have to become the same thing before anything looks
   at them, or the two paths drift and only one of them stays correct. */
const readFile = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onerror = () => reject(new Error("fichier illisible"));
  reader.onload = () => {
    const bytes = new Uint8Array(reader.result);
    let binary = "";
    for (const b of bytes) binary += String.fromCharCode(b);
    resolve(btoa(binary));
  };
  reader.readAsArrayBuffer(file);
});

const parseSupply = (raw) => {
  const supply = {};
  for (const part of raw.split(/[,;\n]+/)) {
    const [item, rate] = part.split("=").map((s) => (s || "").trim());
    const value = Number(rate);
    if (item && Number.isFinite(value) && value > 0) supply[item] = value;
  }
  return supply;
};

const rate = (n) => n.toLocaleString("fr-FR", { maximumFractionDigits: 1 });
const escape = (s) => String(s).replace(/[<>&]/g, (c) =>
  ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

/* An item beside its own icon. A player recognises the picture faster than the English
   name, and a schematic is read at a glance or not at all. */
/** A block's own sprite, for a palette that shows what it is putting down. */
const blockIcon = (name, size = 16, folder = "") => {
  const src = itemIcon(name, size * 2, folder);
  return src ? `<img src="${src}" alt="" width="${size}" height="${size}">` : "";
};

const withIcon = (item, size = 18) => {
  const src = itemIcon(item, size * 2);
  return src ? `<img src="${src}" alt="" width="${size}" height="${size}">` : "";
};

function render(report) {
  const made = Object.entries(report.perMinute).sort((a, b) => b[1] - a[1]);
  const right = [];

  right.push(`<h2 class="title">${escape(report.name)}</h2>
    <p class="sub">${report.width}x${report.height} &middot; ${report.blocks} blocs
      &middot; jeu ${escape(report.gameVersion)}</p>`);

  /* Power alongside the items, because for a whole class of schematics it is the only
     answer. One of them was reported as producing coal and spore pods, which are
     intermediates it eats itself, while the electricity it exists to make went unmentioned
     and was in its own name. */
  const power = report.power || { made: 0, spent: 0, net: 0 };
  const bolt = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"
    style="width:20px;height:20px;fill:currentColor;stroke:none"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>`;

  /* Where it plugs in, asked rather than assumed.

     Guessing is a coin toss: a design has one intake and a dozen pipes that could
     physically be it, and nothing in the file says which the author meant. Guessing wrong
     does not produce a blank, it produces a page of throughputs that look computed and are
     not, which is worse than producing nothing. So it is asked, once, and everything that
     depends on it waits for the answer. */
  const answered = !report.awaiting;
  const inputs = report.ports?.inputs || [];
  const outlets = report.ports?.outputs || [];

  const markLine = (port, colour) => {
    const label = port.resource
      ? `${withIcon(port.resource)}${escape(port.resource)}`
      : `<span style="color:var(--dim)">a preciser</span>`;
    return `<div class="line"><span><span class="pin ${colour}"></span>
      ${escape(port.name)} en (${port.x}, ${port.y})</span>
      <span class="num">${label}${port.rate > 0.001
        ? ` &nbsp;${rate(port.rate * 60)} / min` : ""}</span></div>`;
  };

  if (!answered || inputs.length || outlets.length) {
    right.push(`<div class="card ${answered ? "" : "ask"}">
      <h2>Entrees et sorties</h2>${
      inputs.length || outlets.length
        ? inputs.map((p) => markLine(p, "in")).join("")
          + outlets.map((p) => markLine(p, "out")).join("")
        : `<p class="hint-line" style="margin-top:0">Rien de marque pour l'instant.</p>`
    }<div class="row" style="margin-top:12px">
      <button type="button" class="${answered ? "" : "primary"}" id="ports-mark">${
        inputs.length || outlets.length ? "Marquer autre chose" : "Marquer sur l'image"}</button>
      <button type="button" id="ports-sealed">Rien n'entre ni ne sort</button>
      ${inputs.length || outlets.length
        ? `<button type="button" id="ports-clear">Tout effacer</button>` : ""}
    </div>
    <p class="hint-line">${answered
      ? "Clique une bande ou un tuyau sur l'image pour en ajouter ou en corriger un."
      : "Clique une bande ou un tuyau sur l'image, dis si c'est une entree ou une sortie, "
        + "et ce qui y passe. Forge ne devine pas : sur une conception un peu grosse, "
        + "deviner l'arrivee est un coup de de, et un coup de de rate donne une page de "
        + "chiffres qui ont l'air calcules."}</p>
    </div>`);
  }

  /* What it takes to feed this, computed rather than asked for. Nobody knows offhand that
     a layout drinks eighteen water a second; everybody can picture two mechanical pumps.

     This is the half a schematic can answer by itself, and it is worth saying that it is a
     different half from the one above: what a layout eats comes from its machines and is a
     fact; where it plugs in comes from its author's intent and is not. So this shows
     straight away, and once a tile has been marked it also says how much has to arrive on
     that particular tile. */
  const sockets = {};
  for (const port of inputs) {
    if (port.resource) (sockets[port.resource] = sockets[port.resource] || []).push(port);
  }

  const needs = report.needs || [];
  if (needs.length) {
    right.push(`<div class="card"><h2>Il lui faut</h2>${needs.map((need) => {
      const best = need.options.slice(0, 3);
      const label = need.resource.startsWith("*")
        ? "un combustible quelconque"
        : `${withIcon(need.resource)}${escape(need.resource)}`;
      const where = sockets[need.resource] || [];
      return `<div class="line"><span>${label}</span>
        <span class="num">${rate(need.perMinute)} / min</span></div>` + (best.length
        ? `<div class="chips" style="margin:6px 0 8px">${best.map((o) =>
            `<span class="chip"><span class="num">${o.count}</span> ${escape(o.block)}</span>`)
            .join(`<span style="color:var(--dim);align-self:center">ou</span>`)}</div>`
        : "") + (where.length
        ? `<p class="hint-line" style="margin:0 0 10px">${where.length > 1
             ? `Reparti sur les <strong>${where.length}</strong>
                ${where[0].carries === "liquid" ? "tuyaux" : "bandes"} marques, soit
                ${rate(need.perMinute / where.length)} / min chacun.`
             : `Sur le ${where[0].carries === "liquid" ? "tuyau" : "bande"} marque en
                (${where[0].x}, ${where[0].y}).`}</p>`
        : `<p class="hint-line" style="margin:0 0 10px">Marque la bande ou le tuyau par
           ou ca doit arriver, sur l'image.</p>`);
    }).join("")}<p class="hint-line">Debit maximal, foreuse posee sur une tache pleine.
      Sur une tache a moitie couverte il en faut deux fois plus.</p></div>`);
  }

  /* And what it gives back once it has all that, which is what a player is shopping for. */
  const full = report.potential || { made: 0, spent: 0 };
  if (full.made > 0.01 || full.spent > 0.01) {
    right.push(`<div class="card"><h2>Une fois nourrie a fond</h2>
      ${full.made > 0.01
        ? `<div class="line"><span>Produit</span>
             <span class="num good">${rate(full.made)} energie / s</span></div>` : ""}
      ${full.spent > 0.01
        ? `<div class="line"><span>Consomme</span>
             <span class="num warn">${rate(full.spent)} energie / s</span></div>` : ""}
      ${full.made > 0.01
        ? `<div class="line"><span><strong>Net</strong></span>
             <span class="num ${full.made - full.spent >= 0 ? "good" : "bad"}">
             ${rate(full.made - full.spent)} energie / s</span></div>` : ""}
    </div>`);
  }

  if (answered) right.push(`<div class="card"><h2>${
    report.sealed || report.selfFed ? "Avec ses propres sources"
    : report.fedItself ? "Branchee comme elle est" : "Avec ce que tu as indique"}</h2>${
    power.made > 0.01
      ? `<div class="out-rate" style="color:var(--accent)">${bolt}
           <b>${rate(power.net)}</b><span>energie / s &nbsp;<span style="color:var(--dim)">
           (${rate(power.made)} produits, ${rate(power.spent)} consommes)</span></span></div>`
      : ""
  }${
    made.map(([item, n]) => `<div class="out-rate">${withIcon(item, 22)}
      <b>${rate(n)}</b><span>${escape(item)} / min</span></div>`).join("")
  }${
    !made.length && power.made <= 0.01
      ? `<p class="empty">Rien tant qu'on ne lui donne rien. Indique un apport
         au-dessus pour voir ce que ca donne.</p>`
      : ""
  }${
    power.made <= 0.01 && power.spent > 0.01
      ? `<div class="line"><span>Consomme de l'energie sans en produire</span>
         <span class="num warn">${rate(power.spent)} / s</span></div>`
      : ""
  }</div>`);

  /* What the chain makes on the way and eats itself. Worth saying, and worth not
     confusing with what comes out. */
  const inside = Object.entries(report.internal || {})
    .filter(([, n]) => n * 60 > 0.5)
    .sort((a, b) => b[1] - a[1]);
  if (inside.length && answered) {
    right.push(`<div class="card"><h2>Fabrique et consomme sur place</h2>${
      inside.map(([item, n]) =>
        `<div class="line"><span>${withIcon(item)}${escape(item)}</span>
          <span class="num">${rate(n * 60)} / min</span></div>`).join("")
    }<p class="hint-line">Ces objets ne sortent pas : ils alimentent les machines de la
      schematique elle-meme.</p></div>`);
  }

  const fedSomething = made.length || (report.power && report.power.made > 0.01);
  if (report.bottleneck && fedSomething && answered) {
    const [name, share] = report.bottleneck;
    right.push(`<div class="card"><h2>Goulot</h2>
      <div class="line"><span>${escape(name)}</span>
        <span class="num bad">nourri a ${Math.round(share * 100)}%</span></div>
      <p class="hint-line">C'est ce bloc qui limite toute la ligne. Elargis ce qui
        l'alimente avant d'ajouter des machines derriere.</p>
    </div>`);
  } else if (made.length) {
    right.push(`<div class="card"><h2>Goulot</h2>
      <div class="line"><span class="good">Aucun, tout tourne a plein regime.</span></div>
    </div>`);
  }

  // "Connected to nothing" holds whatever the intake turns out to be; "arrives without
  // being drunk" does not, so the first is shown at once and the second waits.
  const surplus = answered ? Object.entries(report.surplus || {}) : [];
  const idle = Object.entries(report.idle || {});
  if (surplus.length || idle.length) {
    const rows = [
      ...surplus.map(([item, n]) =>
        `<div class="line"><span>${withIcon(item)}${escape(item)} arrive sans pouvoir etre
          consomme</span><span class="num warn">+${rate(n * 60)} / min</span></div>`),
      ...idle.map(([name, n]) =>
        `<div class="line"><span>${escape(name)} relie a rien</span>
          <span class="num bad">x${n}</span></div>`),
    ];
    right.push(`<div class="card"><h2>Gaspille</h2>${rows.join("")}</div>`);
  }

  /* The panel the game itself shows, reproduced from its own formulas, and the places
     Forge parts with it named rather than hidden. Two reasons for it to be on the page:
     a player can hold it against what they see in game and decide whether to trust the
     rest, and the disagreements are the point of the site. The game's own figure ignores
     overdrive projectors entirely, so a reactor farm under five of them is understated by
     eighteen thousand energy a second, and the author of one such layout wrote the higher
     number in its description while the game contradicted them in their own preview. */
  /* In the game's own order rather than by quantity, so the row can be read against the
     panel in game without hunting. The order is the item registry's, which is what
     `ItemSeq` walks. */
  const cost = Object.entries(report.cost || {})
    .sort((a, b) => (report.itemOrder?.[a[0]] ?? 99) - (report.itemOrder?.[b[0]] ?? 99));
  const asGame = report.asTheGameSaysIt;
  if (cost.length || asGame) {
    const boost = asGame && report.potential
      && Math.abs(report.potential.made - asGame.made) > 0.01;
    right.push(`<div class="card"><h2>Ce que dit le jeu</h2>${
      cost.length
        ? `<div class="chips" style="margin-bottom:10px">${cost.map(([item, n]) =>
            `<span class="chip">${withIcon(item, 15)}<span class="num">${n}</span></span>`)
            .join("")}</div>`
        : ""
    }${
      asGame && (asGame.made > 0.01 || asGame.spent > 0.01)
        ? `<div class="line"><span>Energie</span><span class="num">
             <span class="good">+${rate(asGame.made)}</span>
             &nbsp;<span class="warn">-${rate(asGame.spent)}</span></span></div>`
        : ""
    }<p class="hint-line">Cout et energie calcules avec les formules du jeu, a l'unite
      pres : c'est l'encart que tu vois sur l'apercu d'une schematique.</p>${
      boost
        ? `<div class="line" style="margin-top:8px"><span>Forge compte plutot</span>
             <span class="num good">${rate(report.potential.made)} energie / s</span></div>
           <p class="hint-line">Le jeu ignore les accelerateurs. Ici
             <strong>${asGame.projectors}</strong> en couvre${asGame.projectors > 1 ? "nt" : ""}
             <strong>${asGame.boosted}</strong> bloc${asGame.boosted > 1 ? "s" : ""},
             qui tournent moitie plus vite, et jusqu'a deux fois et quart plus vite si tu
             les alimentes en matiere de phase.</p>`
        : ""
    }</div>`);
  }

  const notes = [];
  for (const [name, n] of Object.entries(report.unknown || {})) {
    notes.push(`<li>${escape(name)} x${n} : inconnu de ce catalogue, traite comme un mur.</li>`);
  }
  if (!report.settled) {
    notes.push(`<li>La disposition boucle sur elle-meme, le debit affiche n'est pas un
      regime stable.</li>`);
  }
  if (report.altered) {
    notes.push(`<li>La chaine collee est legerement abimee, probablement par le
      copier-coller. Elle a ete lue quand meme.</li>`);
  }
  if (report.truncated) {
    notes.push(`<li><strong>${report.truncated} blocs</strong> n'ont pas pu etre lus : la
      chaine s'arrete avant la fin. Recopie-la directement depuis le jeu.</li>`);
  }
  if (notes.length) {
    right.push(`<div class="card"><h2>A savoir</h2><ul class="notes">${notes.join("")}</ul></div>`);
  }

  /* Putting a block down.
  
     The list starts with what the schematic already uses, because the common edit by a
     long way is extending a line that is already there, and only then opens onto the rest
     of the catalogue behind a search. A palette of two hundred and fifty three blocks
     sorted alphabetically is a palette nobody scrolls. */
  const used = [...new Set(report.tiles.map((tile) => tile.name))]
    .filter((name) => catalogueOf()?.blocks?.[name])
    .sort();
  right.push(`<div class="card"><h2>Poser un bloc</h2>
    <p class="hint-line" style="margin:0 0 8px">Choisis un bloc, puis clique une case vide
      sur l'image ${placing ? "" : "&mdash; un pourtour s'ouvre autour pour poser au dela du bord"}. ${placing
        ? `<strong>${escape(placing)}</strong> est en main : echap pour le reposer.`
        : "Clique un bloc pose pour le tourner ou l'enlever."}</p>
    <input type="search" id="palette-search" placeholder="Chercher dans les 253 blocs"
      aria-label="Chercher un bloc">
    <div class="chips palette" id="palette">${
      used.map((name) => `<button type="button" class="chip pick ${
        placing === name ? "on" : ""}" data-block="${escape(name)}">${
        blockIcon(name)}${escape(name)}</button>`).join("")
    }</div>
  </div>`);

  /* The ground, painted rather than imagined.
  
     Until now a drill was reported at its best case, "on a full patch", which is the tool
     admitting it does not know what the drill is standing on. Paint the ore and the
     question has an answer: the game's own formula needs the number of covered tiles and
     nothing else. */
  const floors = Object.entries(catalogueOf()?.blocks || {})
    .filter(([, block]) => block.floor);
  const ores = floors.filter(([, block]) => block.drops || block.drops_liquid);
  const plain = floors.filter(([, block]) => !block.drops && !block.drops_liquid);
  const painted = Object.keys(ground).length;

  right.push(`<div class="card"><h2>Le sol</h2>
    <p class="hint-line" style="margin:0 0 8px">${brush.floor
      ? `<strong>${escape(brush.floor)}</strong> au pinceau : clique ou glisse sur l'image,
         echap pour le poser.`
      : "Peins le terrain sous la schematique, et les foreuses et les pompes disent ce"
        + " qu'elles sortent vraiment au lieu de leur meilleur cas."}</p>

    <label class="slide"><span>Transparence</span>
      <input type="range" id="fade" min="0" max="100" value="${Math.round(opacity * 100)}">
    </label>

    <div class="row" style="margin:8px 0">
      <label class="slide" style="flex:1"><span>Pinceau</span>
        <input type="range" id="brush-size" min="1" max="7" step="2" value="${brush.size}">
        <span class="num">${brush.size}x${brush.size}</span></label>
      ${painted ? `<button type="button" id="ground-clear">Effacer le sol</button>` : ""}
    </div>

    <p class="hint-line" style="margin:6px 0 4px">Minerais et liquides</p>
    <div class="chips palette" id="ores">${
      ores.map(([name, block]) => `<button type="button" class="chip pick ${
        brush.floor === name ? "on" : ""}" data-floor="${escape(name)}">${
        blockIcon(name, 16, "floor/")}${withIcon(block.drops || block.drops_liquid, 14)}${
        escape(name)}</button>`).join("")
    }</div>

    <p class="hint-line" style="margin:10px 0 4px">Terrains</p>
    <div class="chips palette" id="grounds">${
      plain.slice(0, 60).map(([name]) => `<button type="button" class="chip pick ${
        brush.floor === name ? "on" : ""}" data-floor="${escape(name)}">${
        blockIcon(name, 16, "floor/")}${escape(name)}</button>`).join("")
    }</div>
    ${painted ? `<p class="hint-line" style="margin-top:10px"><strong>${painted}</strong>
      case${painted > 1 ? "s" : ""} peinte${painted > 1 ? "s" : ""}.</p>` : ""}
  </div>`);

  /* Keeping it, which is the only thing on this page that needs a server. Offered after
     the answer rather than before it: nobody wants to name a schematic they have not seen
     analysed yet. */
  /* Editing one already kept, rather than only ever making new ones. A name typed wrong or
     an intake marked wrongly was permanent, and the only way out was to delete it and
     start over. */
  const editing = opened.slug ? opened : null;
  const chosen = editing ? editing.visibility : "private";

  /* The name is on the card rather than left implied. Pasting a corrected string over an
     open schematic is the point of editing one - a paste that lost five blocks is exactly
     what a player wants to fix - so the string is allowed to change under it, and the card
     says out loud which schematic is about to be overwritten. */
  right.push(`<div class="card"><h2>${editing ? "Mettre a jour" : "Garder"}</h2>${
    editing ? `<p class="hint-line" style="margin:0 0 10px">Tu modifies
      <strong>${escape(editing.name)}</strong>, gardee le
      ${escape(editing.kept || "")}. Le bouton ecrase ce qui est enregistre.</p>` : ""}
    <div class="row" id="keep-row">
      <input type="text" id="keep-name"
        value="${escape(editing ? editing.name : report.name)}"
        aria-label="Nom de la schematique">
      <button class="primary" id="keep" type="button">${
        editing ? "Enregistrer" : "Garder"}</button>
      <label style="display:inline-flex;align-items:center;gap:7px;color:var(--dim)">
        qui la voit
        <select id="keep-visibility" aria-label="Qui peut la voir">
          <option value="private" ${chosen === "private" ? "selected" : ""}>moi seul</option>
          <option value="unlisted" ${chosen === "unlisted" ? "selected" : ""}>par lien</option>
          <option value="public" ${chosen === "public" ? "selected" : ""}>tout le monde</option>
        </select>
      </label>
    </div>
    <textarea id="keep-desc" rows="2" placeholder="Une ligne pour dire ce qu'elle fait"
      aria-label="Description">${escape(editing?.description || "")}</textarea>
    ${editing ? `<div class="row" style="margin-top:8px">
      <button type="button" id="keep-new">Garder comme une nouvelle</button>
      <a class="button" href="/s/${escape(editing.slug)}">Voir sa page</a>
    </div>` : ""}
    <p class="hint-line" id="keep-note"></p>
  </div>`);

  /* What the rings on the picture mean. They had no legend at all, and worse, half of them
     meant "Forge thinks maybe": a schematic came back under fourteen green squares, one
     slightly brighter than the others, and nothing anywhere said which was which. Now
     there is only one kind of ring, it is only ever there because somebody put it there,
     and it carries the icon of what travels through it. */
  const legend = inputs.length || outlets.length ? `<p class="legend">${
    inputs.length ? `<span class="dot in"></span>Par la que ca entre` : ""
  }${
    outlets.length ? `<span class="dot out"></span>Par la que ca sort` : ""
  }<span class="dim">Clique une bande ou un tuyau pour en marquer un autre.</span></p>`
  : `<p class="legend"><span class="dim">Clique une bande ou un tuyau sur l'image pour dire
     par ou ca entre et par ou ca sort.</span></p>`;

  out.innerHTML = `<div class="split">
    <div class="side">
      <div class="row" style="margin:0 0 10px">
        <button type="button" id="to-editor">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          Editer cette schematique
        </button>
      </div>
      <div class="stage"><canvas id="view" role="img"
        aria-label="Apercu de ${escape(report.name)}, ${report.blocks} blocs"></canvas></div>
      ${legend}
      <div id="block" class="card block-panel">
        <h2>Un bloc</h2>
        <p class="empty">Clique un bloc sur l'image pour voir ce qu'il fait, et pour dire
          si c'est par la que ca entre ou que ca sort.</p>
      </div>
    </div>
    <div>${right.join("")}</div>
  </div>`;

  const known = new Map(report.graph.nodes.map((n) => [n.name, n]));
  const sizeOf = (name) => known.get(name)?.block.size || 1;
  const roleOf = (name) => known.get(name)?.role || "";
  // Kept for the rest of the page, which draws the same schematic again for the preview.
  measures = { sizeOf, roleOf };
  /* Sized from the room it actually has rather than from a number typed here, and drawn
     again when that room changes. A hardcoded width made the picture half the panel on a
     desktop and overflow it on a phone. */
  const stage = $("view").parentElement;
  let drawn = null;
  const paint = () => {
    drawn = draw($("view"), report.tiles, sizeOf, roleOf, {
      width: stage.clientWidth - 32,
      maxScale: 48,
      // Room to put something down beyond the edge, but only while something is waiting
      // to be put down. The brush needs it too: the ground around a build is exactly
      // where the drills that feed it would go.
      margin: placing || brush.floor ? 2 : 0,
      ground,
      opacity,
      inputs: report.ports?.inputs || [],
      outputs: report.ports?.outputs || [],
    });
    if (drawn.missing.length) console.warn("sprites manquants :", drawn.missing);
  };
  paint();
  if (window.ResizeObserver) new ResizeObserver(paint).observe(stage);

  wireBlocks(report, () => drawn, paint);
  wireKeep(report);

  $("to-editor")?.addEventListener("click", () => enterEditor(report.tiles));

  $("ports-sealed")?.addEventListener("click", () => {
    marked = {};
    sealed = true;
    run();
  });
  $("ports-clear")?.addEventListener("click", () => {
    marked = {};
    sealed = false;
    run();
  });
  $("palette")?.addEventListener("click", (event) => {
    const chip = event.target.closest("[data-block]");
    if (!chip) return;
    placing = placing === chip.dataset.block ? null : chip.dataset.block;
    for (const other of $("palette").querySelectorAll("[data-block]")) {
      other.classList.toggle("on", other.dataset.block === placing);
    }
    // Redrawn rather than re-analysed: choosing a block changes nothing about the
    // schematic, it only opens the apron around it.
    paint();
    $("view")?.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  $("palette-search")?.addEventListener("input", (event) => {
    const asked = event.target.value.trim().toLowerCase();
    const names = asked
      ? Object.keys(catalogueOf()?.blocks || {})
          .filter((name) => name.includes(asked)).slice(0, 40).sort()
      : used;
    $("palette").innerHTML = names.map((name) =>
      `<button type="button" class="chip pick ${placing === name ? "on" : ""}"
        data-block="${escape(name)}">${blockIcon(name)}${escape(name)}</button>`).join("")
      || `<span class="hint-line">Aucun bloc de ce nom.</span>`;
  });

  /* The brush. Painting redraws rather than re-analyses, because the ground only changes
     what a drill or a pump pulls out and the analysis is re-run once the stroke ends. */
  for (const id of ["ores", "grounds"]) {
    $(id)?.addEventListener("click", (event) => {
      const chip = event.target.closest("[data-floor]");
      if (!chip) return;
      brush.floor = brush.floor === chip.dataset.floor ? null : chip.dataset.floor;
      placing = null;
      for (const other of document.querySelectorAll("[data-floor]")) {
        other.classList.toggle("on", other.dataset.floor === brush.floor);
      }
      paint();
      $("view")?.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }

  $("fade")?.addEventListener("input", (event) => {
    opacity = Number(event.target.value) / 100;
    paint();
  });
  $("brush-size")?.addEventListener("input", (event) => {
    brush.size = Number(event.target.value);
    event.target.parentElement.querySelector(".num").textContent =
      `${brush.size}x${brush.size}`;
  });
  $("ground-clear")?.addEventListener("click", () => {
    ground = {};
    run();
  });

  $("ports-mark")?.addEventListener("click", () => {
    $("view")?.scrollIntoView({ behavior: "smooth", block: "center" });
    $("block")?.classList.add("waiting");
  });
}

/**
 * Change the schematic, and let everything else follow.
 *
 * The edit is applied to the tiles, written back out as the string the game reads, and
 * dropped into the box the player pasted into. From there nothing else on the page has to
 * know that an edit happened: the analysis re-runs on a string, the same way it does on a
 * fresh paste, and saving keeps the edited version because that is what is in the box.
 *
 * The marks move with it. Writing normalises the schematic onto its own bounding box, so
 * pulling a block off the left edge shifts every tile one to the right, and a mark left
 * where it was would silently be on a different block.
 */
async function edit(change) {
  const note = $("keep-note");
  try {
    const parsed = await fromBase64(text.value);
    const before = bounds(parsed.tiles, measures.sizeOf);
    const tiles = change(parsed.tiles);
    if (!tiles.length) throw new Error("il ne resterait plus rien");

    const after = bounds(tiles, measures.sizeOf);
    const dx = after.left - before.left;
    const dy = after.bottom - before.bottom;
    if (dx || dy) {
      const moved = {};
      for (const [at, mark] of Object.entries(marked)) {
        const [x, y] = at.split(",").map(Number);
        moved[`${x - dx},${y - dy}`] = mark;
      }
      marked = moved;
      if (looking) {
        const [x, y] = looking.split(",").map(Number);
        looking = `${x - dx},${y - dy}`;
      }
    }

    text.value = await toBase64(tiles, {
      tags: parsed.tags, sizeOf: measures.sizeOf,
    });
    // The edited string is not a new schematic somebody pasted, so the marks stay.
    lastPayload = String(text.value).replace(/\s+/g, "");
    await run();
  } catch (error) {
    if (note) note.textContent = `Modification impossible : ${error.message}`;
  }
}

async function run() {
  const payload = String(text.value).replace(/\s+/g, "");
  if (!payload) {
    out.innerHTML = `<div class="card error">Colle une schematique, ou depose un fichier.</div>`;
    return;
  }
  if (payload !== lastPayload) {
    marked = {};
    sealed = false;
    looking = null;
    lastPayload = payload;
  }
  $("go").disabled = true;
  out.innerHTML = `<div class="skeleton"></div>`;
  try {
    /* Computed here, on this machine. Nothing is uploaded, so a base somebody has not
       published stays theirs, and the page costs nothing to host however many people
       use it. */
    const [report] = await Promise.all([
      analyse(payload, parseSupply($("supply").value), marked, { sealed, ground }),
      loadSprites(),
    ]);
    render(report);
  } catch (error) {
    out.innerHTML = `<div class="card error">${escape(error.message)}</div>`;
  } finally {
    $("go").disabled = false;
  }
}

/* Escape puts the palette down. A block stays armed after being placed, because putting
   down a line of belt is one click per tile and disarming between each would be absurd;
   the cost of that is needing a way out that is not hunting for the chip again. */
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || (!placing && !brush.floor)) return;
  placing = null;
  brush.floor = null;
  for (const chip of document.querySelectorAll("[data-floor]")) chip.classList.remove("on");
  for (const chip of document.querySelectorAll("#palette [data-block]")) {
    chip.classList.remove("on");
  }
  run();
});

/* ------------------------------------------------------------------------------------
   La bascule entre analyser et editer.

   Le mode garde son propre plateau plutot que de repasser par la chaine string -> analyse
   a chaque geste. Reserialiser une schematique de trois cents blocs a chaque clic serait
   du travail jete, et surtout l historique d annulation ne survivrait pas a l aller-retour.

   Le plateau n est donc pas detruit en revenant sur l analyse : il est mis de cote, et
   reediter reprend exactement ou on s etait arrete, ctrl+Z compris.
   ------------------------------------------------------------------------------------ */
let editor = null;

/**
 * Le plateau mis de cote en sortant, et la schematique qu il decrivait alors.
 *
 * Les deux vont ensemble : reprendre le plateau n est legitime que si la chaine n a pas
 * bouge entre temps. Coller une autre schematique pendant qu on etait sur le rapport doit
 * repartir d un plateau neuf, sinon on editerait l ancienne en croyant editer la nouvelle.
 */
let kept = null;
let keptFor = null;

async function enterEditor(tiles = null) {
  /* Le catalogue est demande explicitement : `catalogueOf` ne rend quelque chose qu apres
     une premiere analyse, et « construire depuis zero » est justement le chemin ou aucune
     analyse n a eu lieu. */
  let known;
  try {
    [known] = await Promise.all([loadCatalogue(), loadSprites()]);
  } catch (error) {
    out.innerHTML = `<div class="card error">${escape(error.message)}</div>`;
    return;
  }
  if (editor) editor.destroy();
  const same = kept && keptFor === lastPayload;
  editor = mountEditor({
    host: $("editor"),
    board: same ? kept : null,
    tiles: tiles || [],
    ground,
    catalogue: known,
    onAnalyse: leaveEditor,
  });
  document.body.style.overflow = "hidden";
}

async function leaveEditor(board) {
  const built = board.tiles;
  ground = board.ground;
  const mounted = editor;
  editor = null;
  document.body.style.overflow = "";
  mounted.destroy();

  if (!built.length) {
    out.innerHTML = `<div class="card">Rien a analyser : le plateau est vide.</div>`;
    return;
  }
  /* La schematique redevient la chaine que le jeu lit, qui reste la source de verite de
     tout le reste de la page : l analyse, la sauvegarde et le presse-papiers travaillent
     dessus et n ont pas a savoir qu un editeur existe. */
  text.value = await toBase64(built, {
    tags: { name: "sans nom" },
    sizeOf: (name) => known(name),
  });
  lastPayload = String(text.value).replace(/\s+/g, "");
  /* Le plateau est garde tel quel, historique compris : la bascule ne doit rien couter.
     Un editeur ou revenir en arriere efface ce qu on pouvait defaire est un editeur ou
     personne ne bascule, donc ou l analyse ne sert plus a rien pendant qu on construit. */
  kept = board;
  keptFor = lastPayload;
  await run();
}

/** La taille d un bloc, prise au catalogue plutot qu au rapport, qui n existe pas encore. */
const known = (name) => catalogueOf()?.blocks?.[name]?.size || 1;

$("build").addEventListener("click", () => enterEditor([]));

$("go").addEventListener("click", run);
text.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
});

$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  text.value = await readFile(file);
  run();
});

$("paste").addEventListener("click", async () => {
  try {
    text.value = (await navigator.clipboard.readText()).trim();
    run();
  } catch {
    out.innerHTML = `<div class="card error">Le navigateur a refuse l'acces au
      presse-papiers. Colle dans le champ avec ctrl+v.</div>`;
    text.focus();
  }
});

for (const kind of ["dragenter", "dragover"]) {
  drop.addEventListener(kind, (e) => { e.preventDefault(); drop.classList.add("over"); });
}
for (const kind of ["dragleave", "drop"]) {
  drop.addEventListener(kind, (e) => { e.preventDefault(); drop.classList.remove("over"); });
}
drop.addEventListener("drop", async (e) => {
  const file = e.dataTransfer.files[0];
  if (!file) return;
  text.value = await readFile(file);
  run();
});

/* Clicking a block ---------------------------------------------------------------- */

/**
 * What the player marked by hand, kept across re-analyses of the same schematic.
 *
 * Guessing where a schematic plugs in is genuinely hard: a design has one intake and a
 * dozen pipes that could physically take one, and nothing in the file says which the
 * author meant. So the guess is a default and this is the answer.
 */
let marked = {};

/**
 * Whether the player has said where the schematic plugs in.
 *
 * Nothing that depends on it is shown until they have. Guessing the intake of a design
 * with a dozen candidate pipes is a coin toss, and a wrong guess does not produce a blank,
 * it produces a full page of throughputs that look computed and are not. Better to ask
 * once: "it is those pipes", "let me point at them", or "nothing goes in".
 */
let sealed = false;

/** The block the panel is showing, kept so that marking one does not close it. */
let looking = null;

/**
 * The block waiting to be put down, if the palette has one selected.
 *
 * Editing here rewrites the pasted string rather than keeping a parallel copy of the
 * schematic. There is one source of truth, it is the same string the game reads, and
 * every part of the page that already works off it keeps working without knowing that
 * anything was edited.
 */
let placing = null;

/**
 * The ground the schematic is standing on, tile by tile.
 *
 * `{ "x,y": { floor, overlay } }`, the game's own two layers: an ore is laid over a floor
 * rather than instead of it. Painted rather than read out of a save, because the question
 * it answers is "what would this do if I put it there", and there is no there yet.
 *
 * It is what turns "at best, on a full patch" into a figure. A drill's rate in the game is
 * `(drillTime + hardness * multiplier) / tiles covered`, and until now the tiles covered
 * were imagined.
 */
let ground = {};

/** What the brush is holding, and how wide it paints. */
let brush = { floor: null, size: 1 };

/** How solid the build is drawn, so the ground under it can be seen and painted. */
let opacity = 1;

/**
 * The saved schematic this page is looking at, if it came from one.
 *
 * Kept so that reopening one is editing it rather than making a second copy, and so that
 * the intakes its author marked by hand come back with it. They were stored from the first
 * day and never read: reopening threw away the one answer the tool cannot work out for
 * itself and asked for it again.
 */
let opened = {};

/** How big and what kind each block is, worked out once per report and reused. */
let measures = { sizeOf: () => 1, roleOf: () => "" };

const rateLine = (label, rates, unit = "/ min", factor = 60) => {
  const rows = Object.entries(rates || {}).filter(([, v]) => v > 0.001);
  if (!rows.length) return "";
  return rows.map(([item, value]) =>
    `<div class="line"><span>${withIcon(item)}${escape(item)} ${label}</span>
      <span class="num">${rate(value * factor)} ${unit}</span></div>`).join("");
};

function showBlock(report, tile) {
  const panel = $("block");
  if (!tile) {
    panel.innerHTML = `<h2>Un bloc</h2><p class="empty">Clique un bloc sur l'image pour
      voir ce qu'il fait, et pour dire si c'est par la que ca entre ou que ca sort.</p>`;
    return;
  }

  const at = `${tile.x},${tile.y}`;
  const role = {
    conveyor: "convoyeur", conduit: "tuyau", junction: "jonction", router: "routeur",
    bridge: "pont", sorter: "trieur", drill: "foreuse", pump: "pompe",
    crafter: "usine", generator: "generateur", sink: "consommateur", power: "reseau electrique",
  }[tile.role] || tile.role || "bloc";

  const parts = [`<h2>${escape(tile.name)}</h2>
    <p class="sub" style="margin:0 0 10px">${role} &middot; ${tile.size}x${tile.size}
      &middot; en (${tile.x}, ${tile.y})</p>`];

  /* What the ground gives it, which is the whole reason for painting one. "Best case, on
     a full patch" was the tool saying it did not know. */
  if (tile.dug) {
    parts.push(`<div class="line"><span>${withIcon(tile.dug.resource)}
      ${escape(tile.dug.resource)} sorti du sol</span>
      <span class="num good">${rate(tile.dug.rate * 60)} / min</span></div>`);
    if (tile.dug.covered !== undefined) {
      parts.push(`<p class="hint-line" style="margin:2px 0 8px">Couvre
        <strong>${tile.dug.covered}</strong> case${tile.dug.covered > 1 ? "s" : ""}
        sur ${tile.dug.of} : c'est ce rapport qui fixe le debit.</p>`);
    }
  } else if (tile.role === "drill" || tile.role === "pump") {
    parts.push(`<p class="hint-line" style="margin:2px 0 8px">Rien dessous. Peins le sol
      pour savoir ce qu'elle sort.</p>`);
  }

  if (tile.fed !== undefined) {
    const share = Math.round(tile.fed * 100);
    parts.push(`<div class="line"><span>Tourne a</span>
      <span class="num ${share > 99 ? "good" : share > 0 ? "warn" : "bad"}">${share}%</span>
      </div>`);
  }
  parts.push(rateLine("consomme", tile.needsLiquid, "/ s", 1));
  parts.push(rateLine("consomme", Object.fromEntries(
    Object.entries(tile.needs).map(([k, v]) =>
      [k, v * (tile.craftTime ? 60 / tile.craftTime : 0)])), "/ min", 60));
  // A pipe does not produce water, it carries it. The same figure means two different
  // things depending on the block it sits on, and calling it production on a conduit read
  // as the tool having found a spring in the middle of a pipe.
  const makes = ["crafter", "generator", "drill", "pump", "source"].includes(tile.role);
  parts.push(rateLine(makes ? "produit" : "porte", tile.through, "/ min", 60));
  if (tile.powerOut) {
    parts.push(`<div class="line"><span>Produit</span>
      <span class="num good">${rate(tile.powerOut)} energie / s</span></div>`);
  }
  if (tile.power) {
    parts.push(`<div class="line"><span>Consomme</span>
      <span class="num warn">${rate(tile.power)} energie / s</span></div>`);
  }
  parts.push(`<div class="line"><span>Relie a</span>
    <span class="num">${tile.fedBy} en entree, ${tile.feeds} en sortie</span></div>`);

  /* Marking, which is the one thing on this panel the schematic cannot answer by itself.

     Two questions, in order: is this a way in or a way out, and what travels on it. The
     second is a short list rather than a free field, because a pipe can only ever hold a
     liquid the layout is short of, and offering the whole catalogue would be asking the
     player to do the narrowing that the schematic already did. */
  const mark = marked[at]
    ? (typeof marked[at] === "string" ? { side: marked[at], resource: null } : marked[at])
    : null;
  const offered = report.offers?.[at] || [];
  // Marked on presence rather than on the list being non-empty: a block can be a way in
  // with nothing worth offering on it, and it still has to be markable.
  const canMark = Object.prototype.hasOwnProperty.call(report.offers || {}, at);

  if (canMark || mark) {
    const side = (which, label) => `<button type="button" data-side="${which}"
      class="${mark?.side === which ? "primary" : ""}">${label}</button>`;

    parts.push(`<div class="mark">
      <div class="row">${side("in", "Entree")}${side("out", "Sortie")}${
        mark ? `<button type="button" data-side="">Retirer</button>` : ""}</div>${
      mark?.side === "in"
        ? (offered.length
            ? `<p class="hint-line" style="margin:10px 0 6px">Qu'est-ce qui arrive ici ?</p>
               <div class="chips">${offered.map((resource) =>
                 `<button type="button" class="chip pick ${
                   mark.resource === resource ? "on" : ""}" data-resource="${
                   escape(resource)}">${withIcon(resource, 15)}${escape(resource)}</button>`
                 ).join("")}</div>`
            : `<p class="hint-line" style="margin:10px 0 0">Cette schematique ne manque de
               rien qui puisse passer par la.</p>`)
        : mark?.side === "out"
          ? `<p class="hint-line" style="margin:10px 0 0">Ce qui sort n'est pas un choix :
             c'est ce qui arrive jusqu'ici. Toi tu dis ou, la schematique dit quoi.</p>`
          : ""
    }</div>
    <p class="hint-line">Garde avec la schematique. Forge ne devine pas les entrees :
      sur une conception un peu grosse c'est un coup de de.</p>`);
  }

  /* Editing, which turns a viewer into a tool. Rewriting the string rather than keeping a
     second copy of the schematic beside it: one source of truth, and it is the same string
     the game reads. */
  const spins = catalogueOf()?.blocks?.[tile.name]?.rotate;
  parts.push(`<div class="row edit">
    ${spins ? `<button type="button" id="spin">Tourner</button>` : ""}
    <button type="button" id="scrap">Retirer ce bloc</button>
  </div>`);

  panel.innerHTML = parts.join("");

  $("spin")?.addEventListener("click", () => edit((tiles) => tiles.map((t) =>
    t.x === tile.x && t.y === tile.y
      ? { ...t, rotation: ((t.rotation | 0) + 1) % 4 } : t)));
  $("scrap")?.addEventListener("click", () => {
    looking = null;
    edit((tiles) => tiles.filter((t) => !(t.x === tile.x && t.y === tile.y)));
  });

  panel.querySelector(".mark")?.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;

    if (button.dataset.side !== undefined) {
      const which = button.dataset.side;
      if (!which || mark?.side === which) delete marked[at];
      else {
        // One offer means no question: a pipe on a layout short of nothing but water
        // carries water, and asking would be theatre.
        marked[at] = { side: which, resource: which === "in" && offered.length === 1
          ? offered[0] : (mark?.resource ?? null) };
      }
      sealed = false;
      run();
      return;
    }

    if (button.dataset.resource) {
      marked[at] = { side: "in", resource: button.dataset.resource };
      sealed = false;
      run();
    }
  });
}

/** Map a click on the picture back to the block under it. */
function wireBlocks(report, drawnNow, repaint) {
  const canvas = $("view");
  if (!canvas) return;
  canvas.style.cursor = "pointer";

  /* Painting the ground, on press and while dragging.
  
     A stroke is one gesture, so the analysis re-runs when it ends rather than on every
     tile: painting a patch of ore is twenty tiles, and re-solving a maximum flow twenty
     times while a finger is still moving would make the page stutter for no answer
     anybody reads. */
  const at = (event) => {
    const drawn = drawnNow();
    if (!drawn) return null;
    const rect = canvas.getBoundingClientRect();
    return [
      drawn.box.left + Math.floor((event.clientX - rect.left) / drawn.scale),
      drawn.box.bottom + drawn.box.height - 1
        - Math.floor((event.clientY - rect.top) / drawn.scale),
    ];
  };

  let painting = false;
  const dab = (event) => {
    if (!brush.floor) return;
    const spot = at(event);
    if (!spot) return;
    const block = catalogueOf()?.blocks?.[brush.floor] || {};
    const layer = block.overlay ? "overlay" : "floor";
    const reach = Math.floor(brush.size / 2);
    for (let dx = -reach; dx <= reach; dx++) {
      for (let dy = -reach; dy <= reach; dy++) {
        const key = `${spot[0] + dx},${spot[1] + dy}`;
        const was = ground[key] || {};
        ground[key] = { ...was, [layer]: brush.floor };
        // An ore is laid over ground, never over nothing. Painting one onto a bare tile
        // drew a half transparent sprite over the page itself, which reads as a hole.
        if (layer === "overlay" && !was.floor) ground[key].floor = "stone";
      }
    }
    repaint();
  };

  canvas.addEventListener("pointerdown", (event) => {
    if (!brush.floor) return;
    painting = true;
    canvas.setPointerCapture(event.pointerId);
    dab(event);
  });
  canvas.addEventListener("pointermove", (event) => { if (painting) dab(event); });
  for (const kind of ["pointerup", "pointercancel"]) {
    canvas.addEventListener(kind, () => {
      if (!painting) return;
      painting = false;
      // The stroke is over: now the numbers are worth redoing.
      run();
    });
  }

  canvas.addEventListener("click", (event) => {
    const drawn = drawnNow();
    if (!drawn) return;
    const rect = canvas.getBoundingClientRect();
    const tx = drawn.box.left + Math.floor((event.clientX - rect.left) / drawn.scale);
    // Screen coordinates count down from the top; the game counts up from the bottom.
    const ty = drawn.box.bottom + drawn.box.height - 1
      - Math.floor((event.clientY - rect.top) / drawn.scale);

    const hit = report.detail.find((tile) => {
      const offset = Math.trunc(-(tile.size - 1) / 2);
      return tx >= tile.x + offset && tx < tile.x + offset + tile.size
        && ty >= tile.y + offset && ty < tile.y + offset + tile.size;
    });
    // A block chosen in the palette turns a click into a placement, on an empty tile.
    if (placing && !hit) {
      edit((tiles) => [...tiles, { x: tx, y: ty, block: placing, rotation: 0 }]);
      return;
    }
    if (brush.floor) return;   // painting is handled on the move, not on the click

    looking = hit ? `${hit.x},${hit.y}` : null;
    showBlock(report, hit || null);
  });

  // Marking a block re-runs the analysis, which redraws the page. Without this the panel
  // came back empty every time, so picking what arrives meant finding the block again.
  if (looking) {
    showBlock(report, report.detail.find((t) => `${t.x},${t.y}` === looking) || null);
  }
}

/* Keeping a schematic ------------------------------------------------------------- */

let me = null;
let lastPayload = null;

/**
 * The token Laravel expects, taken from the cookie it sets.
 *
 * A static page has no template to render one into, and `XSRF-TOKEN` exists for exactly
 * this: Laravel writes it as a cookie and accepts it back in the `X-XSRF-TOKEN` header.
 */
const token = () => decodeURIComponent(
  document.cookie.split("; ").find((c) => c.startsWith("XSRF-TOKEN="))?.slice(11) || "");

/**
 * Who is signed in, asked once.
 *
 * The analyser is a static page and stays one, so it learns this from an endpoint rather
 * than from a rendered template. Nothing about the analysis waits on the answer.
 */
async function whoAmI() {
  try {
    const answer = await fetch("/api/moi", { headers: { Accept: "application/json" } });
    me = answer.ok ? (await answer.json())?.user ?? null : null;
  } catch { me = null; }

  const nav = $("nav");
  if (!nav) return;
  nav.insertAdjacentHTML("beforeend", me
    ? `<a href="/mes-schematiques">Mes schematiques</a>
       <span class="who">${me.avatar
         ? `<img src="${me.avatar}" alt="" width="24" height="24">` : ""}
         ${escape(me.name)}</span>`
    : `<a class="discord" href="/auth/discord">
         <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19 19 0 0 0 15.6 3l-.2.5c1.6.4 2.4.9 3.2 1.5a11 11 0 0 0-9.2 0c.8-.6 1.7-1.1 3.2-1.5L12.4 3a19 19 0 0 0-4.7 1.4C4.7 8.8 3.9 13.1 4.3 17.3a19 19 0 0 0 5.7 2.9l.7-1.3c-.8-.3-1.5-.7-2.1-1.1l.4-.3a13 13 0 0 0 11.3 0l.4.3c-.6.4-1.3.8-2.1 1.1l.7 1.3c2-.6 4-1.6 5.7-2.9.5-4.9-.8-9.1-4.7-12.9ZM9.7 14.9c-1.1 0-2-1-2-2.3s.9-2.3 2-2.3 2 1 2 2.3-.9 2.3-2 2.3Zm4.6 0c-1.1 0-2-1-2-2.3s.9-2.3 2-2.3 2 1 2 2.3-.9 2.3-2 2.3Z"/></svg>
         Se connecter avec Discord
       </a>`);
}

function wireKeep(report) {
  const button = $("keep");
  const note = $("keep-note");
  if (!button) return;

  if (!me) {
    button.disabled = true;
    note.innerHTML = `<a href="/auth/discord">Connecte-toi avec Discord</a> pour garder tes
      schematiques et les publier.`;
    return;
  }

  const save = async (slug) => {
    /* Drawn again, clean, rather than photographing the canvas on screen.

       The picture on screen carries the analysis: green rings on every socket Forge thinks
       is an intake, yellow on the outlets. Sent as it was, those rings were baked into the
       preview that shows up in a Discord unfurl and on the schematic's own page, where
       nothing explains them and nobody asked for them.

       Still drawn by the same renderer, so the unfurl cannot disagree with the page. */
    const plate = document.createElement("canvas");
    draw(plate, report.tiles, measures.sizeOf, measures.roleOf,
         { width: 640, maxScale: 32 });

    const body = {
      name: $("keep-name").value.trim() || report.name,
      description: $("keep-desc").value.trim() || null,
      code: String(text.value).replace(/\s+/g, ""),
      visibility: $("keep-visibility").value,
      analysis: {
        width: report.width, height: report.height, blocks: report.blocks,
        perMinute: report.perMinute, needs: report.needs,
        potential: report.potential, power: report.power,
        // Kept so reopening it does not throw away the one answer the tool cannot work
        // out for itself.
        marked,
      },
      thumbnail: plate.toDataURL("image/png"),
    };

    const answer = await fetch(slug ? `/api/schematiques/${slug}` : "/api/schematiques", {
      method: slug ? "PATCH" : "POST",
      headers: {
        "Content-Type": "application/json",
        "X-XSRF-TOKEN": token(),
        Accept: "application/json",
      },
      body: JSON.stringify(body),
    });
    const said = await answer.json();
    if (!answer.ok) throw new Error(said.message || "refuse");
    return said;
  };

  const run = (slug, done) => async () => {
    button.disabled = true;
    note.textContent = "Enregistrement...";
    try {
      const said = await save(slug);
      note.innerHTML = `${done} <a href="${said.url}">Voir la page</a>`;
      if (!slug && said.slug) opened = { ...said, mine: true };
    } catch (error) {
      note.textContent = `Impossible d'enregistrer : ${error.message}`;
    } finally {
      button.disabled = false;
    }
  };

  button.addEventListener("click",
    run(opened.slug || null, opened.slug ? "A jour." : "Gardee."));
  // Same schematic, kept a second time: a variant worth keeping beside the original
  // rather than instead of it.
  $("keep-new")?.addEventListener("click", run(null, "Gardee comme une nouvelle."));
}

/* Fetched while the player is still pasting, so the picture appears with the numbers
   rather than a beat later. */
loadSprites().catch(() => {});
whoAmI();

/* Arriving from a schematic's page, to look at it or to change it. */
const asked = new URLSearchParams(location.search).get("s");
if (asked) {
  fetch(`/api/schematiques/${encodeURIComponent(asked)}`, {
    headers: { Accept: "application/json" },
  })
    .then((r) => (r.ok ? r.json() : null))
    .then((found) => {
      if (!found?.code) return;
      text.value = found.code;
      // Its author's own marks come back with it, and its author edits it in place.
      marked = { ...(found.marked || {}) };
      sealed = !!found.sealed;
      if (found.mine) opened = found;
      run();
    })
    .catch(() => {});
}
</script>
