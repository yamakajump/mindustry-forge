#######################################################################
# mindustry-forge - vhost de PRODUCTION
# Expose par Cloudflare Tunnel sur mindustryforge.com -> http://localhost
#
# CE FICHIER EST LA VERITE. deploy.sh le recopie vers
# /etc/nginx/sites-available/ a chaque deploiement, teste la conf, et
# restaure la version precedente si nginx la refuse. Editer le fichier
# actif en SSH direct ne sert donc a rien : la modification sera ecrasee
# au deploiement suivant, sans prevenir.
#
# ---------------------------------------------------------------------
# CE SITE DOIT ETRE INDEXE
# ---------------------------------------------------------------------
# Ne jamais ajouter ici de « X-Robots-Tag: noindex ». Le vhost de recette
# de delicieux-instants, sur le meme serveur, en porte un volontairement ;
# copier son en-tete par reflexe sortirait ce site de Google en quelques
# semaines, sans qu'aucune erreur ne le signale : il repondrait 200 et
# s'afficherait parfaitement pendant tout ce temps.
#######################################################################
server {
    listen 80;
    listen [::]:80;
    # www est redirige vers l'apex par une regle Cloudflare, en amont. Il
    # reste declare ici pour que le jour ou cette regle saute, le trafic
    # atterrisse sur le site plutot que sur le 444 du vhost par defaut.
    server_name mindustryforge.com www.mindustryforge.com;

    root /var/www/mindustry-forge/site/public;
    index index.php;

    charset utf-8;

    # Une schematique collee est un texte court ; rien ici ne justifie
    # d'accepter des corps de requete volumineux.
    client_max_body_size 4M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # L'analyse tourne dans le navigateur : /forge/ est du statique pur,
    # que le serveur n'a aucune raison de recalculer a chaque visite.
    #
    # Mais le code et les donnees doivent etre revalides a chaque fois, et
    # ce n'est pas de la prudence : le 27/08/2026 un deploiement a laisse
    # quatre heures d'une feuille de style perimee sur le site, ou le signe
    # de marque s'affichait a 192 pixels au lieu de 18 et l'entete faisait
    # 258 pixels de haut. Le code etait juste, le cache mentait.
    #
    # Un simple numero de version dans l'URL ne suffirait pas : ces modules
    # s'importent entre eux en relatif (`from "./needs.js"`), donc
    # estampiller le point d'entree laisse tout le graphe derriere lui
    # perime. Tant qu'il n'y a pas de nom de fichier hache, la revalidation
    # est la seule reponse honnete.
    #
    # Le cout est une requete conditionnelle par module, a laquelle nginx
    # repond 304 avec son ETag. Quelques centaines d'octets contre un site
    # qui parait casse pendant quatre heures apres chaque mise en ligne.
    location ~ ^/forge/.*\.(js|css|json)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Les images et les polices, elles, ne changent qu'a un redeploiement
    # et rien ne depend de leur fraicheur a la seconde.
    #
    # Prefixe simple et non `^~` : un `^~` gagnant arrete la recherche et
    # nginx n'evalue plus aucune expression reguliere, donc le bloc
    # ci-dessus ne serait jamais atteint et la correction n'aurait rien
    # corrige, sans qu'aucun message ne le signale.
    location /forge/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Pool dedie : isole du panel de facturation heberge sur le meme
        # serveur, qui tourne sous un autre compte et un autre socket.
        fastcgi_pass unix:/run/php/php8.3-fpm-mforge.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
