#######################################################################
# mindustry-forge - PRODUCTION vhost
# Exposed by Cloudflare Tunnel on mindustryforge.com -> http://localhost
#
# THIS FILE IS THE TRUTH. deploy.sh copies it to
# /etc/nginx/sites-available/ on every deployment, tests the config, and
# restores the previous version if nginx refuses it. Editing the live
# file over SSH is therefore pointless: the change is overwritten by the
# next deployment, without warning.
#
# ---------------------------------------------------------------------
# THIS SITE MUST BE INDEXED
# ---------------------------------------------------------------------
# Never add an "X-Robots-Tag: noindex" here. The staging vhost of
# delicieux-instants, on the same server, carries one deliberately;
# copying its header out of habit would take this site out of Google in a
# few weeks, with no error to report it: it would answer 200 and render
# perfectly the whole time.
#######################################################################
server {
    listen 80;
    listen [::]:80;
    # www is redirected to the apex by a Cloudflare rule, upstream. It stays
    # declared here so that the day that rule goes away, the traffic lands
    # on the site rather than on the default vhost's 444.
    server_name mindustryforge.com www.mindustryforge.com;

    root /var/www/mindustry-forge/site/public;
    index index.php;

    charset utf-8;

    # A pasted schematic is a short piece of text; nothing here justifies
    # accepting large request bodies.
    client_max_body_size 4M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The analysis runs in the browser: /forge/ is pure static, which the
    # server has no reason to recompute on every visit.
    #
    # But the code and the data have to be revalidated every time, and that
    # is not caution: on 27/08/2026 a deployment left four hours of a stale
    # stylesheet on the site, where the brand mark rendered at 192 pixels
    # instead of 18 and the header stood 258 pixels tall. The code was
    # right, the cache lied.
    #
    # A plain version number in the URL would not be enough: these modules
    # import each other relatively (`from "./needs.js"`), so stamping the
    # entry point leaves the whole graph behind it stale. As long as there
    # is no hashed file name, revalidation is the only honest answer.
    #
    # The cost is one conditional request per module, which nginx answers
    # 304 with its ETag. A few hundred bytes against a site that looks
    # broken for four hours after every release.
    location ~ ^/forge/.*\.(js|css|json)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # The images and the fonts, on the other hand, change only at a
    # redeployment and nothing depends on their freshness to the second.
    #
    # A plain prefix rather than `^~`: a winning `^~` stops the search and
    # nginx evaluates no regular expression at all, so the block above
    # would never be reached and the fix would have fixed nothing, with no
    # message to report it.
    location /forge/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # A dedicated pool: isolated from the other sites served by the
        # same server, running under another account and another socket.
        fastcgi_pass unix:/run/php/php8.3-fpm-mforge.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
