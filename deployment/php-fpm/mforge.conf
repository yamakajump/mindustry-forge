;######################################################################
; Pool PHP-FPM dedie a mindustry-forge.
;
; Le serveur heberge aussi d'autres applications, dont des applications
; metier. Un site public ouvert a tous ne doit pas tourner sous le meme
; compte qu'elles : d'ou ce pool, son propre utilisateur et son propre
; socket.
;
; ATTENTION : ajouter ou renommer un pool demande un `systemctl restart
; php8.3-fpm`, pas un `reload`. Un reload reutilise les sockets herites
; et le nouveau pool n'apparait jamais, sans le moindre message d'erreur.
;######################################################################
[mforge]
user = mforge
group = www-data
listen = /run/php/php8.3-fpm-mforge.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 6M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 30
php_admin_flag[expose_php] = off
