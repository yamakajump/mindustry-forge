;######################################################################
; PHP-FPM pool dedicated to mindustry-forge.
;
; The server also hosts other applications, business ones included. A
; public site open to anyone must not run under the same account as
; those: hence this pool, its own user and its own socket.
;
; WARNING: adding or renaming a pool needs a `systemctl restart
; php8.3-fpm`, not a `reload`. A reload reuses the inherited sockets and
; the new pool never appears, without a single error message.
;######################################################################
[mforge]
user = mforge
group = www-data
listen = /run/php/php8.3-fpm-mforge.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 6M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 30
php_admin_flag[expose_php] = off
